<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Lesson: guided problems · Choose function</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Kalam:wght@400;700&display=swap" rel="stylesheet"><style>
/* Math notebook: graph-paper ground, navy fountain-pen ink, a yellow highlighter, a red correction pen.
   Two typefaces: Atkinson Hyperlegible (text, built for young readers) and Kalam (the handwritten voice). */
:root{
  --paper:#FBFCFE; --sheet:#FFFFFF; --rule:#DCE5F2; --rule2:#C9D6EA;
  --ink:#1C2A4A; --pencil:#5E6A82; --faint:#8E99AE;
  --hl:#FFE45E; --hl-soft:#FFF4B8; --red:#C23A2E; --green:#1E7A50; --blue:#2D6BD0;
  --p1:#2D6BD0; --p2:#D98A00; --p3:#7B4CC0; --p4:#1E7A50; --p5:#138A8A; --p6:#C2407A;
  --console:#14223F; --console-ink:#DDE6F6;
  --hand:"Kalam","Comic Neue","Segoe Print",cursive;
  --text:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r-sm:5px; --r-md:9px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--text);font-size:17px;line-height:1.55}
body.reading{background-image:linear-gradient(var(--rule) 1px,transparent 1px),linear-gradient(90deg,var(--rule) 1px,transparent 1px);
  background-size:26px 26px;background-attachment:local}
a{color:var(--blue)}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px;border-radius:3px}
h1,h2,h3{font-family:var(--hand);font-weight:700;line-height:1.15;color:var(--ink);margin:0 0 .4em}
h1{font-size:2.5rem}
h2{font-size:1.9rem}
h3{font-size:1.4rem}
.hl{background:linear-gradient(transparent 55%,var(--hl) 55%,var(--hl) 92%,transparent 92%)}
button{font:inherit;cursor:pointer}
.btn{border:1.5px solid var(--ink);background:var(--sheet);color:var(--ink);border-radius:var(--r-sm);padding:.35em .8em;font-size:.95rem}
.btn:hover{background:var(--hl-soft)}
.btn.primary{background:var(--ink);color:#fff}
.btn.primary:hover{background:#2B3E68}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.warn{border-color:var(--red);color:var(--red)}
kbd{font-family:var(--text);border:1px solid var(--rule2);border-bottom-width:2px;border-radius:4px;padding:0 .3em;font-size:.85em}

/* ---------- equations ---------- */
.eq{font-size:1.35rem;text-align:center;padding:.7em .6em;margin:.2em 0 1em;border-left:4px solid var(--ink);
  background:var(--sheet);display:flex;flex-wrap:wrap;gap:.35em;align-items:center;justify-content:center}
.frac{display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;margin:0 .15em}
.frac>span:first-child{border-bottom:1.5px solid var(--ink);padding:0 .25em}
.frac>span:last-child{padding:0 .25em}
.binom{display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;padding:0 .35em;position:relative;line-height:1.1}
.binom::before,.binom::after{content:"";position:absolute;top:0;bottom:0;width:.35em;border:1.5px solid var(--ink)}
.binom::before{left:0;border-right:none;border-radius:.6em 0 0 .6em}
.binom::after{right:0;border-left:none;border-radius:0 .6em .6em 0}
.eqnote{font-size:.85rem;color:var(--pencil)}

/* ---------- SVG pictures ---------- */
svg.pic{width:100%;height:auto;max-height:340px;display:block;margin:0 auto;font-family:var(--text);overflow:visible}
.pic .t,.pic .cap{fill:var(--pencil);font-size:12px}
.pic .vert{writing-mode:tb}
.pic .chip{fill:#fff;stroke:var(--ink);stroke-width:1.3}
.pic .chip.picked{fill:var(--hl);stroke:var(--ink)}
.pic .chip.used{fill:#EEF1F6;stroke:#B6BECC}
.pic .chip.banned{fill:#FBE9E7;stroke:var(--red)}
.pic .chiptxt{fill:var(--ink);font-size:13px;font-weight:700}
.pic .chiptxt.used{fill:#9AA4B5}
.pic .strike{stroke-width:2;stroke-linecap:round}
.pic .strike.used{stroke:#9AA4B5}
.pic .strike.banned{stroke:var(--red)}
.pic .strike.big{stroke-width:3.5;opacity:.85}
.pic .sub{font-size:9px}
.pic .chip.p1,.pic .tile.p1{fill:#E1ECFC;stroke:var(--p1)}
.pic .chip.p2,.pic .tile.p2{fill:#FCEFD6;stroke:var(--p2)}
.pic .chip.p3,.pic .tile.p3{fill:#ECE3F8;stroke:var(--p3)}
.pic .chip.p4,.pic .tile.p4{fill:#DEF1E7;stroke:var(--p4)}
.pic .chip.p5,.pic .tile.p5{fill:#DAF0F0;stroke:var(--p5)}
.pic .chip.p6,.pic .tile.p6{fill:#F8E1EB;stroke:var(--p6)}
.pic .tile{fill:#fff;stroke:var(--ink);stroke-width:1.4}
.pic .tile.real{fill:var(--hl)}
.pic .tile.pl{fill:#F1F3F7;stroke:#9AA4B5}
.pic .tilet{fill:var(--ink);font-size:16px;font-weight:700}
.pic .tilet.sm{font-size:13px}
.pic .slot{fill:#fff;stroke:var(--ink);stroke-width:1.6}
.pic .result{fill:var(--hl);stroke:var(--ink);stroke-width:1.6}
.pic .fracline{stroke:var(--ink);stroke-width:1.6}
.pic .numbox{fill:#fff;stroke:var(--ink);stroke-width:1.2}
.pic .slotlab{fill:var(--pencil);font-size:12px}
.pic .slotn,.pic .calcn{fill:var(--ink);font-size:20px;font-weight:700}
.pic .op{fill:var(--ink);font-size:22px;font-weight:700}
.pic .op.big{font-size:30px}
.pic .card{fill:#fff;stroke:var(--rule2)}
.pic .arrow{stroke:var(--ink);stroke-width:2;fill:none}
.pic .ahead{fill:var(--ink)}
.pic .groupbox{fill:var(--hl-soft);stroke:var(--ink);stroke-width:1.6}
.pic .groupt{fill:var(--ink);font-size:17px;font-weight:700}
.pic .pg-cell{fill:#fff;stroke:var(--rule2);stroke-width:1}
.pic .pg-cell.diag{fill:#FBE9E7}
.pic .pg-cell.lower{fill:#EEF1F6}
.pic .pg-cell.hl,.pic .pg-cell.twin-lit{fill:var(--hl);stroke:var(--ink)}
.pic .pg-cell:hover{stroke:var(--ink);stroke-width:2}
.pic .pgt{fill:var(--ink);pointer-events:none}
.pic .pgt.dim{fill:#9AA4B5}
.pic .gridlab{fill:var(--ink);font-size:13px;font-weight:700}
.pic .edge{stroke:var(--pencil);stroke-width:1.3}
.pic .tnode{fill:#fff;stroke:var(--rule2)}
.pic .nodet{fill:var(--ink);font-size:12px;font-weight:700}
.pic .node.root{fill:var(--ink)}
.pic .rowhl{fill:var(--hl-soft)}
.pic .brace{fill:none;stroke:var(--ink);stroke-width:1.6}
.pic .seg{stroke:var(--faint);stroke-width:1.6}
.pic .seg.hl{stroke:var(--blue);stroke-width:4;stroke-linecap:round;opacity:.85}
.pic .seg.hl2{stroke:var(--p2);stroke-width:4;stroke-linecap:round;opacity:.8}
.pic .dot{fill:var(--ink)}
.pic .dotlab{fill:var(--ink);font-size:13px;font-weight:700}
.pic .gl{stroke:var(--rule2);stroke-width:1.3}
.pic .gl.hlv{stroke:var(--blue);stroke-width:3.5}
.pic .gl.hlh{stroke:var(--green);stroke-width:3.5}
.pic .numv{fill:var(--blue);font-weight:700}
.pic .numh{fill:var(--green);font-weight:700}
.pic .shade{fill:var(--hl);opacity:.6}
.pic .path{fill:none;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
.pic .path.leg1{stroke:var(--blue)}
.pic .path.leg2{stroke:var(--p2);stroke-dasharray:7 4}
.pic .bag{fill:#F4F7FC;stroke:var(--ink);stroke-width:1.5}
.pic .oval{fill:none;stroke:var(--hl);stroke-width:8;opacity:.9}
.pic .oval.diff{stroke:#F2C2BC}
.pic .lcell{fill:#fff;stroke:var(--rule2)}
.pic .lcell.hl{fill:var(--hl)}
.pic .lt{fill:var(--ink);font-size:13px;font-weight:700}
.pic .wcard{fill:#fff;stroke:var(--ink);stroke-width:1.4}
.pic .wcard.skip{fill:#F3F5F9;stroke:#B6BECC;stroke-dasharray:5 4}
.pic .cardt{fill:var(--ink);font-size:15px}
.pic .coin.gold{fill:#F7D774;stroke:#9A7400}
.pic .coin.silver{fill:#E3E7EE;stroke:#7D8696}
.pic .coint{fill:var(--ink);font-size:11px;font-weight:700}
.pic .badring{fill:none;stroke:var(--red);stroke-width:2.5}
.pic .state{fill:#fff;stroke:var(--rule2)}
.pic .state.picked{fill:var(--hl-soft);stroke:var(--ink)}
.pic .person{fill:var(--hl-soft);stroke:var(--ink)}
.pic .persont{fill:var(--ink);font-weight:700;font-size:13px}
.hstack{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap;width:100%}
.hstack>svg.pic{width:100%;flex:1 1 200px;min-width:0}
.vstack{display:flex;flex-direction:column;gap:8px;align-items:center;width:100%}
.vstack>svg.pic{width:100%}
.ptable{border-collapse:collapse;margin:0 auto;font-size:.92rem;background:#fff}
.ptable th,.ptable td{border:1px solid var(--rule2);padding:.25em .6em;text-align:center}
.ptable th{background:#EEF3FA;font-weight:700}
.ptable tr.hl td{background:var(--hl-soft);font-weight:700}

/* ---------- story component ---------- */
.story{container-type:inline-size;background:var(--sheet);border:1.5px solid var(--ink);border-radius:var(--r-md);padding:.8rem;margin:.6rem 0 1.2rem}
.story:focus-visible{outline:3px solid var(--blue)}
.story .frame{display:none;margin:0}
.story .frame.on{display:block}
.story.all .frame{display:block;border-bottom:1px dashed var(--rule2);padding-bottom:.8rem;margin-bottom:.8rem}
.frame .pic-wrap{min-height:80px;display:flex;align-items:center;justify-content:center;overflow-x:auto}
.frame figcaption{margin-top:.5rem}
.frame figcaption p{margin:.2em 0}
.frame .ftitle{font-family:var(--hand);font-size:1.15rem;margin:0 0 .3rem}
.frame.skip .ftitle{text-decoration:line-through;color:var(--faint)}
.frame.skip figcaption p{color:var(--pencil)}
.ask{margin-top:.5rem;padding:.4rem .7rem;border-left:4px solid var(--hl);background:#FFFBE6;font-size:.95rem}
.ask b{font-family:var(--hand)}
.story-ctl{display:flex;align-items:center;gap:.6rem;margin-top:.6rem;flex-wrap:wrap}
.dots{display:flex;gap:5px;flex-wrap:wrap}
.dots button{width:13px;height:13px;border-radius:50%;border:1.5px solid var(--ink);background:#fff;padding:0}
.dots button.on{background:var(--ink)}
.dots button.seen{background:var(--rule2)}
.story-ctl label{font-size:.9rem;color:var(--pencil);margin-left:auto}
.story.all .story-ctl .nav{visibility:hidden}

/* plan-guided: flowchart beside picture on wide containers, step strip on narrow */
.wbody{display:block}
.plan-side{display:none}
.plan-strip{display:flex;gap:4px;align-items:center;margin-bottom:.6rem;flex-wrap:wrap}
.plan-strip span{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--rule2);display:inline-flex;align-items:center;justify-content:center;
  font-weight:700;font-size:.85rem;color:var(--pencil)}
.plan-strip span.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.plan-strip span.skipd{text-decoration:line-through}
.plan-strip .stepname{font-family:var(--hand);font-size:1.1rem;color:var(--ink);margin-left:.4rem;width:auto;height:auto;border:none;justify-content:flex-start}
@container (min-width:680px){
  .wbody{display:grid;grid-template-columns:215px 1fr;gap:1rem}
  .plan-side{display:block}
  .plan-strip{display:none}
}
.plan-side ol{list-style:none;margin:0;padding:0;counter-reset:pl}
.plan-side li{counter-increment:pl;padding:.35rem .5rem .35rem 2.1rem;position:relative;font-size:.9rem;color:var(--pencil);border-radius:6px;margin-bottom:3px}
.plan-side li::before{content:counter(pl);position:absolute;left:.4rem;top:.3rem;width:22px;height:22px;border-radius:50%;border:1.5px solid var(--rule2);
  display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.8rem}
.plan-side li.on{background:var(--hl);color:var(--ink);font-weight:700}
.plan-side li.on::before{background:var(--ink);color:#fff;border-color:var(--ink)}
.plan-side li.skipd{text-decoration:line-through}
.plan-side li+li::after{content:"";position:absolute;left:1.05rem;top:-4px;height:5px;border-left:1.5px solid var(--rule2)}

/* ---------- reading pages ---------- */
.page{max-width:1180px;margin:0 auto;padding:1.4rem 1.2rem 4rem;display:grid;grid-template-columns:230px minmax(0,1fr);gap:2rem}
.toc{position:sticky;top:1rem;align-self:start;max-height:calc(100vh - 2rem);overflow:auto;font-size:.92rem;background:var(--sheet);
  border:1.5px solid var(--ink);border-radius:var(--r-md);padding:.8rem}
.toc a{display:block;text-decoration:none;color:var(--ink);padding:.15rem .3rem;border-radius:4px}
.toc a:hover{background:var(--hl-soft)}
.toc .sub{padding-left:1rem;font-size:.86rem;color:var(--pencil)}
main.reading-main{min-width:0}
.sheet{background:var(--sheet);border:1.5px solid var(--ink);border-radius:var(--r-md);padding:1.3rem 1.4rem;margin-bottom:1.6rem}
.sheet>p,.sheet li{max-width:72ch}
.idea{font-size:1.1rem;font-weight:700}
.chips{display:flex;gap:.4rem;flex-wrap:wrap;margin:.6rem 0}
.chips a{border:1.5px solid var(--ink);border-radius:999px;padding:.1rem .7rem;text-decoration:none;color:var(--ink);font-size:.9rem;background:#fff}
.chips a:hover{background:var(--hl)}
.fromclass{border-left:4px solid var(--blue);background:#F1F6FE;padding:.6rem .8rem;margin:.8rem 0;font-size:.95rem}
.fromclass b{font-family:var(--hand)}
.traps{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:1rem;padding:0;list-style:none}
.traps li{background:#fff;border:1.5px solid var(--ink);border-radius:var(--r-md);padding:.7rem .9rem;max-width:none}
.traps .wrong{color:var(--red);font-weight:700;text-decoration:line-through;text-decoration-thickness:2px}
.cheat{width:100%;border-collapse:collapse}
.cheat td,.cheat th{border:1px solid var(--rule2);padding:.4rem .6rem;vertical-align:top;text-align:left}
.cheat th{background:#EEF3FA}
dl.gloss dt{font-weight:700;margin-top:.6rem}
dl.gloss dd{margin:0 0 0 1rem;max-width:70ch}
.site-head{display:flex;align-items:baseline;gap:1.2rem;flex-wrap:wrap;padding:1rem 1.2rem 0;max-width:1180px;margin:0 auto}
.site-head nav a{margin-right:1rem}
.lede{font-size:1.15rem;max-width:62ch}

/* ---------- workbench ---------- */
body.bench{height:100vh;overflow:hidden;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;gap:.6rem;padding:.45rem .8rem;border-bottom:1.5px solid var(--ink);background:var(--sheet);flex-wrap:wrap}
.topbar .brand{font-family:var(--hand);font-weight:700;font-size:1.25rem;margin-right:.4rem}
.topbar select{font:inherit;font-size:.92rem;padding:.25rem;border:1.5px solid var(--ink);border-radius:var(--r-sm);max-width:280px}
.topbar .meta{font-size:.9rem;color:var(--pencil);display:flex;gap:1rem;align-items:center}
.topbar .links{margin-left:auto;display:flex;gap:.8rem;font-size:.92rem}
.benchgrid{flex:1;min-height:0;display:grid;grid-template-columns:200px minmax(0,1fr) minmax(360px,430px)}
.rail{border-right:1.5px solid var(--ink);overflow:auto;padding:.5rem;background:var(--paper)}
.rail h4{font-family:var(--hand);font-size:1.05rem;margin:.6rem 0 .2rem}
.rail button{display:flex;align-items:center;gap:.5rem;width:100%;text-align:left;border:none;background:none;padding:.25rem .4rem;border-radius:5px;font-size:.92rem;color:var(--ink)}
.rail button:hover{background:var(--hl-soft)}
.rail button.cur{background:var(--hl);font-weight:700}
.sdot{width:11px;height:11px;border-radius:50%;border:1.5px solid var(--pencil);flex:none}
.sdot.prog{background:linear-gradient(90deg,var(--blue) 50%,#fff 50%);border-color:var(--blue)}
.sdot.closed{background:var(--green);border-color:var(--green)}
.middle{overflow:auto;padding:0 1rem 1rem;background:var(--paper)}
.tabs{display:flex;gap:.2rem;position:sticky;top:0;background:var(--paper);padding-top:.5rem;z-index:2;border-bottom:1.5px solid var(--ink)}
.tabs button{border:1.5px solid var(--ink);border-bottom:none;border-radius:7px 7px 0 0;background:#EEF3FA;padding:.3rem .9rem;margin-bottom:-1.5px;font-size:.95rem}
.tabs button[aria-selected="true"]{background:var(--sheet);font-weight:700}
.tabpanel{padding-top:.8rem}
.ptext{font-size:1.08rem;background:var(--sheet);border:1.5px solid var(--ink);border-radius:var(--r-md);padding:.8rem 1rem}
.pfig{max-width:380px;margin:.8rem auto 0}
.pfig svg.pic{max-height:300px}
.pfig .pic .gl{stroke:var(--ink);stroke-width:1.2}
.pnote{font-size:.9rem;color:var(--pencil);margin:.5rem 0}
.inclass{display:inline-block;font-size:.85rem;border:1px solid var(--blue);color:var(--blue);border-radius:999px;padding:0 .6rem;margin-right:.4rem}
.above{display:inline-block;font-size:.85rem;border:1px solid var(--p3);color:var(--p3);border-radius:999px;padding:0 .6rem}
.verified{margin-top:1rem;border:2px solid var(--green);border-radius:var(--r-md);background:#F2FAF5;padding:.8rem 1rem}
.verified h3{color:var(--green)}
.right{border-left:1.5px solid var(--ink);display:flex;flex-direction:column;min-height:0;background:var(--sheet)}
.rscroll{overflow:auto;padding:.7rem .8rem;flex:1;min-height:0}
.pills{display:flex;gap:.3rem;flex-wrap:wrap;margin-bottom:.5rem}
.pills button{border:1.5px solid var(--ink);border-radius:999px;background:#fff;padding:.05rem .65rem;font-size:.88rem}
.pills button.cur{outline:3px solid var(--hl);outline-offset:1px;font-weight:700}
.pills button.ok{background:#DDF1E5;border-color:var(--green)}
.pills button.handed{background:#FBE9E7;border-color:var(--red)}
.pills button.tried{background:#EEF3FA}
.stepq{font-weight:700;margin:.2rem 0 .5rem}
.editor{display:flex;border:1.5px solid var(--ink);border-radius:var(--r-sm);height:140px;background:#fff;
  background-image:linear-gradient(transparent 23px,var(--rule) 23px);background-size:100% 24px;background-position:0 6px}
.gutter{width:2.2rem;text-align:right;padding:6px .35rem 0 0;color:var(--faint);font-size:.85rem;line-height:24px;overflow:hidden;border-right:1px solid var(--rule2);user-select:none}
.editor textarea{flex:1;border:none;resize:none;padding:6px .5rem 0;font:inherit;font-size:.95rem;line-height:24px;background:transparent;color:var(--ink);font-family:var(--hand)}
.editor textarea:focus{outline:none}
.editor:focus-within{outline:3px solid var(--blue);outline-offset:1px}
.ansrow{display:flex;gap:.4rem;margin:.6rem 0}
.ansrow input{flex:1;font:inherit;padding:.35rem .5rem;border:1.5px solid var(--ink);border-radius:var(--r-sm);min-width:0}
.btnrow{display:flex;gap:.4rem;flex-wrap:wrap;margin-bottom:.5rem}
.console{background:var(--console);color:var(--console-ink);font-size:.86rem;padding:.6rem .7rem;height:170px;overflow:auto;border-top:1.5px solid var(--ink);flex:none}
.console div{margin-bottom:.3rem;line-height:1.4}
.console .ok{color:#8BE0AC}
.console .bad{color:#FFB3A8}
.console .info{color:#A9C3F0}
.console .hand{color:#FFE45E}
.console .ts{color:#6F84AD;margin-right:.4rem}
.dialog-back{position:fixed;inset:0;background:rgba(28,42,74,.35);display:none;align-items:center;justify-content:center;z-index:50}
.dialog-back.open{display:flex}
.dialog{background:var(--sheet);border:2px solid var(--ink);border-radius:var(--r-md);max-width:460px;padding:1rem 1.2rem;margin:1rem}
.dialog h3{margin-top:0}
.confirm-note{font-size:.88rem;color:var(--red);margin:.3rem 0}
.rules{background:var(--sheet);border:1.5px solid var(--ink);border-radius:var(--r-md);padding:.8rem 1rem}
.rules ol{padding-left:1.3rem;margin:.3rem 0}
.mysteps .ms{background:var(--sheet);border:1px solid var(--rule2);border-radius:var(--r-sm);padding:.5rem .7rem;margin-bottom:.5rem}
.mysteps pre{white-space:pre-wrap;font-family:var(--hand);margin:.3rem 0;font-size:.95rem}
.railtoggle{display:none}

/* ---------- pen ---------- */
.pen-canvas{position:fixed;inset:0;pointer-events:none;z-index:40}
.pen-canvas.active{pointer-events:auto;cursor:crosshair}
.pen-canvas.active.touchpass{touch-action:pan-x pan-y pinch-zoom}
.pen-canvas.active.swallow{touch-action:none}
.pen-bar{position:fixed;right:12px;bottom:12px;z-index:45;background:var(--sheet);border:1.5px solid var(--ink);border-radius:var(--r-md);
  padding:.35rem;display:flex;gap:.25rem;align-items:center;flex-wrap:wrap;max-width:calc(100vw - 24px);box-shadow:0 2px 0 var(--ink)}
.pen-bar button{border:1.5px solid transparent;background:none;border-radius:6px;min-width:30px;height:30px;padding:0 .35rem;font-size:.85rem;color:var(--ink)}
.pen-bar button[aria-pressed="true"]{border-color:var(--ink);background:var(--hl)}
.pen-bar .sw{width:20px;height:20px;border-radius:50%;display:inline-block;vertical-align:middle;border:1.5px solid var(--ink)}
.pen-bar .tools{display:none;gap:.2rem;align-items:center;flex-wrap:wrap}

ag-word formula 7! \u00f7 (3! \u00d7 4!).<\/p><\/figcaption><\/figure><figure class=\"frame\" data-step=\"3\"><p class=\"ftitle\">3. Look-alike groups?<\/p><div class=\"pic-wrap\"><svg class=\"pic \" viewBox=\"0 0 260 56\" role=\"img\" aria-label=\"no look-alikes\" style=\"max-width:377px\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"4\" y=\"4\" width=\"252\" height=\"48\" rx=\"10\" class=\"wcard \"/><text x=\"130.0\" y=\"32\" class=\"cardt\" text-anchor=\"middle\">No look-alike groups<\/text><\/svg><\/div><figcaption><p>Look-alike groups? No: take and leave are different tags, so a T can never trade places with an L. Nothing to divide.<\/p><\/figcaption><\/figure><figure class=\"frame\" data-step=\"4\"><p class=\"ftitle\">4. Check a tiny case<\/p><div class=\"pic-wrap\"><svg class=\"pic \" viewBox=\"0 0 406 42\" role=\"img\" aria-label=\"list\" style=\"max-width:589px\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"8\" y=\"6\" width=\"92\" height=\"24\" rx=\"5\" class=\"lcell\"/><text x=\"54.0\" y=\"23\" class=\"lt\" text-anchor=\"middle\">TTTL \u2192 ABC<\/text><rect x=\"106\" y=\"6\" width=\"92\" height=\"24\" rx=\"5\" class=\"lcell\"/><text x=\"152.0\" y=\"23\" class=\"lt\" text-anchor=\"middle\">TTLT \u2192 ABD<\/text><rect x=\"204\" y=\"6\" width=\"92\" height=\"24\" rx=\"5\" class=\"lcell\"/><text x=\"250.0\" y=\"23\" class=\"lt\" text-anchor=\"middle\">TLTT \u2192 ACD<\/text><rect x=\"302\" y=\"6\" width=\"92\" height=\"24\" rx=\"5\" class=\"lcell\"/><text x=\"348.0\" y=\"23\" class=\"lt\" text-anchor=\"middle\">LTTT \u2192 BCD<\/text><\/svg><\/div><figcaption><p>Tiny case: grab 3 of A, B, C, D. Words with 3 T and 1 L: 4, listed.<\/p><\/figcaption><\/figure><\/div><\/div><div class=\"story-ctl\"><span class=\"nav\"><button type=\"button\" class=\"btn\" data-act=\"back\">\u2190 Back<\/button> <button type=\"button\" class=\"btn primary\" data-act=\"next\">Next step \u2192<\/button><\/span><span class=\"dots\" role=\"group\" aria-label=\"Pictures\"><\/sp \"43\" class=\"calcn\" text-anchor=\"middle\">66<\/text><\/svg><\/div><figcaption><p>239,500,800 \u00f7 3,628,800 = 66. The same as the tag-word formula 12! \u00f7 (10! \u00d7 2!).<\/p><\/figcaption><\/figure><figure class=\"frame\" data-step=\"3\"><p class=\"ftitle\">3. Look-alike groups?<\/p><div class=\"pic-wrap\"><svg class=\"pic \" viewBox=\"0 0 260 56\" role=\"img\" aria-label=\"no look-alikes\" style=\"max-width:377px\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"4\" y=\"4\" width=\"252\" height=\"48\" rx=\"10\" class=\"wcard \"/><text x=\"130.0\" y=\"32\" class=\"cardt\" text-anchor=\"middle\">No look-alike groups<\/text><\/svg><\/div><figcaption><p>Look-alike groups? No: take and leave are different tags, so a T can never trade places with an L. Nothing to divide.<\/p><\/figcaption><\/figure><figure class=\"frame\" data-step=\"4\"><p class=\"ftitle\">4. Check a tiny case<\/p><div class=\"pic-wrap\"><svg class=\"pic \" viewBox=\"0 0 406 42\" role=\"img\" aria-label=\"list\" style=\"max-width:589px\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"8\" y=\"6\" width=\"92\" height=\"24\" rx=\"5\" class=\"lcell\"/><text x=\"54.0\" y=\"23\" class=\"lt\" text-anchor=\"middle\">TTTL \u2192 ABC<\/text><rect x=\"106\" y=\"6\" width=\"92\" height=\"24\" rx=\"5\" class=\"lcell\"/><text x=\"152.0\" y=\"23\" class=\"lt\" text-anchor=\"middle\">TTLT \u2192 ABD<\/text><rect x=\"204\" y=\"6\" width=\"92\" height=\"24\" rx=\"5\" class=\"lcell\"/><text x=\"250.0\" y=\"23\" class=\"lt\" text-anchor=\"middle\">TLTT \u2192 ACD<\/text><rect x=\"302\" y=\"6\" width=\"92\" height=\"24\" rx=\"5\" class=\"lcell\"/><text x=\"348.0\" y=\"23\" class=\"lt\" text-anchor=\"middle\">LTTT \u2192 BCD<\/text><\/svg><\/div><figcaption><p>Tiny case: take 3 of 4. The word is decided by where its one L goes: 4 words, listed.<\/p><\/figcaption><\/figure><\/div><\/div><div class=\"story-ctl\"><span class=\"nav\"><button type=\"button\" class=\"btn\" data-act=\"back\">\u2190 Back<\/button> <button type=\"button\" class=\"btn primary\" data-act=\"next\">Next step \u2192<\/button><\/span><span class=\"dots\" role=\"group\" aria-label=\"Pictures\"><\/span><label><input type=\"checkbox\" class=\"showall\"> Show all steps<\/label><\/div><\/div>", "answer": "66", "check": "Leave 2 of 12: 12 \u00d7 11 \u00f7 2 = 66. Checked: 12!/(10!2!) = 66.", "concept": "c2", "inclass": "19:52", "above": false, "note": null, "figure": null}, {"id": "l4", "label": "Example 1.4", "section": "Guided problems from class", "text": "There are 9 different cookies on a tray. You take 4 of the cookies in a bag, then 3 of the remaining cookies in a second bag, and the last 2 cookies in a third bag. How many ways are there to do this?", "steps": [{"q": "How many ways can the first bag be filled?", "type": "num", "ans": 126, "nudges": ["Plan step 1: which cookies get tag X? How many X's are there?", "Plan step 2: count with order, then remove the order. The word has 4 X's and 5 other letters.", "Plan step 3: no look-alikes yet, since this step is just the first bag."], "hint": "Tag each cookie with its bag: X, Y or Z. The first bag alone is a word with 4 X's and 5 'not yet' tags.", "reveal": "9 choose 4 = 9 \u00d7 8 \u00d7 7 \u00d7 6 \u00f7 24 = 126.", "check": "9!/(4!\u00b75!) = 126.", "ok": "That's the first bag.", "named": {}, "ph": "number or expression", "special": null, "order": false}, {"q": "Once the first bag is full, how many ways can the second bag be filled?", "type": "num", "ans": 10, "nudges": ["Plan step 1: only 5 cookies are left. Tag them Y or Z.", "Plan step 2: a word with 3 Y's and 2 Z's.", "Plan step 3: the bags have different sizes."], "hint": "Of the 5 cookies left, tag 3 with Y and 2 with Z. Count those words.", "reveal": "5 choose 3 = 5 \u00d7 4 \u00d7 3 \u00f7 6 = 10.", "check": "Same as 5 choose 2 = 10 (choose the 2 that stay out).", "ok": "Whoever went in bag 1, there are always 5 left.", "named": {"84": "That chooses from all 9 again. Some are already in bag 1.", "60": "That's 5 \u00d7 4 \u00d7 3 in order. Does the bag care about order?", "126": "That's step 1's answer."}, "ph": "number or expression", "special": null, "order": false}, {"q": "How many ways to do the whole thing?", "type": "num", "ans": 1260, "nudges": ["Plan step 1: every cookie gets X, Y or Z.", "Plan step 2: count with order, then remove the order. The word has 4 X, 3 Y and 2 Z (or combine steps 1 and 2).", "Plan step 3: can bags of different sizes trade places?"], "hint": "Count with order first (line everyone up), then remove the order inside each group. The whole thing is one tag word: 4 X's, 3 Y's and 2 Z's. Count its words.", "reveal": "126 \u00d7 10 \u00d7 1 = 1,260.", "check": "Also 9!/(4!\u00b73!\u00b72!) = 1,260.", "ok": "Three decisions in a row multiply.", "named": {"136": "Adding counts 'bag 1 OR bag 2'. Here you do bag 1 AND bag 2.", "210": "Dividing by 3! would mean the bags could trade places. Can a 4-bag trade with a 3-bag?", "362880": "That's 9!. It also counts the order of cookies inside each bag.", "126": "That's step 1's answer.", "10": "That's step 2's answer."}, "ph": "number or expression", "special": null, "order": false}], "story": "<div class=\"story worked\" id=\"story5\" tabindex=\"0\" aria-label=\"Worked answer: Example 1.4\" data-plan='[&quot;Tag every object&quot;, &quot;Count with order, then remove it&quot;, &quot;Look-alike groups?&quot;, &quot;Check a tiny case&quot;]'><div class=\"wbody\"><div class=\"plan-side\" aria-hidden=\"true\"><ol><li data-s=\"1\">Tag every object with a letter that says where it goes.<\/li><li data-s=\"2\">Count with order (the rule of product treats every tag as different and in a line), then remove the order: divide by each repeated tag&#x27;s repeats!. Two separate words multiply; separate cases add.<\/li><li data-s=\"3\">Look-alike groups (same size, no names)? Remove their order too: write the group word and divide by its repeats!.<\/li><li data-s=\"4\">Check a tiny case you can list.<\/li><\/ol><\/div><div class=\"wmain\"><div class=\"plan-strip\" aria-hidden=\"true\"><span data-s=\"1\">1<\/span><span data-s=\"2\">2<\/span><span data-s=\"3\">3<\/span><span data-s=\"4\">4<\/span><span class=\"stepname\"><\/span><\/div><figure class=\"frame\" data-step=\"1\"><p class=\"ftitle\">1. Tag every object<\/p><div class=\"pic-wrap\"><svg class=\"pic \" viewBox=\"0 0 390 82\" role=\"img\" aria-label=\"tagged objects\" style=\"max-width:566px\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"8\" y=\"6\" width=\"34\" height=\"26\" rx=\"6\" class=\"chip\"/><text x=\"25.0\" y=\"24.0\" class=\"chiptxt \" text-anchor=\"middle\">A<\/text><line x1=\"25.0\" y1=\"33\" x2=\"25.0\" y2=\"42\" class=\"edge\"/><rect x=\"10.0\" y=\"43\" width=\"30\" height=\"28\" rx=\"5\" class=\"tile p5\"/><text x=\"25.0\" y=\"63\" class=\"tilet\" text-anchor=\"middle\">X<\/text><rect x=\"50\" y=\"6\" width=\"34\" height=\"26\" rx=\"6\" class=\"chip\"/><text x=\"67.0\" y=\"24.0\" class=\"chiptxt \" text-anchor=\"middle\">B<\/text><line x1=\"67.0\" y1=\"33\" x2=\"67.0\" y2=\"42\" class=\"edge\"/><rect x=\"52.0\" y=\"43\" width=\"30\" height=\"28\" rx=\"5\" class=\"tile p5\"/><text x=\"67.0\" y=\"63\" class=\"tilet\" text-anchor=\"middle\">X<\/text><rect x=\"92\" y=\"6\" width=\"34\" height=\"26\" rx=\"6\" class=\"chip\"/><text x=\"109.0\" y=\"24.0\" class=\"chiptxt \" text-anchor=\"middle\">C<\/text><line x1=\"109.0\" y1=\"33\" x2=\"109.0\" y2=\"42\" class=\"edge\"/><rect x=\"94.0\" y=\"43\" width=\"30\" height=\"28\" rx=\"5\" class=\"tile p5\"/><text x=\"109.0\" y=\"63\" class=\"tilet\" text-anchor=\"middle\">X<\/text><rect x=\"134\" y=\"6\" width=\"34\" height=\"26\" rx=\"6\" class=\"chip\"/><text x=\"151.0\" y=\"24.0\" class=\"chiptxt \" text-anchor=\"middle\">D<\/text><line x1=\"151.0\" y1=\"33\" x2=\"151.0\" y2=\"42\" class=\"edge\"/><rect x=\"136.0\" y=\"43\" width=\"30\" height=\"28\" rx=\"5\" class=\"tile p5\"/><text x=\"151.0\" y=\"63\" class=\"tilet\" text-anchor=\"middle\">X<\/text><rect x=\"176\" y=\"6\" width=\"34\" height=\"26\" rx=\"6\" class=\"chip\"/><text x=\"193.0\" y=\"24.0\" class=\"chiptxt \" text-anchor=\"middle\">E<\/text><line x1=\"193.0\" y1=\"33\" x2=\"193.0\" y2=\"42\" class=\"edge\"/><rect x=\"178.0\" y=\"43\" width=\"30\" height=\"28\" rx=\"5\" class=\"tile p6\"/><text x=\"193.0\" y=\"63\" class=\"tilet\" text-anchor=\"middle\">Y<\/text><rect x=\"218\" y=\"6\" width=\"34\" height=\"26\" rx=\"6\" class=\"chip\"/><text x=\"235.0\" y=\"24.0\" class=\"chiptxt \" text-anchor=\"middle\">F<\/text><line x1=\"235.0\" y1=\"33\" x2=\"235.0\" y2=\"42\" class=\"edge\"/><rect x=\"220.0\" y=\"43\" width=\"30\" height=\"28\" rx=\"5\" class=\"tile p6\"/><text x=\"235.0\" y=\"63\" class=\"tilet\" text-anchor=\"middle\">Y<\/text><rect x=\"260\" y=\"6\" width=\"34\" height=\"26\" rx=\"6\" class=\"chip\"/><text x=\"277.0\" y=\"24.0\" class=\"chiptxt \" text-anchor=\"middle\">G<\/text><line x1=\"277.0\" y1=\"33\" x2=\"277.0\" y2=\"42\" class=\"edge\"/><rect x=\"262.0\" y=\"43\" width=\"30\" height=\"28\" rx=\"5\" class=\"tile p6\"/><text x=\"277.0\" y=\"63\" class=\"tilet\" text-anchor=\"middle\">Y<\/text><rect x=\"302\" y=\"6\" width=\"34\" height=\"26\" rx=\"6\" class=\"chip\"/><text x=\"319.0\" y=\"24.0\" class=\"chiptxt \" text-anchor=\"middle\">H<\/text><line x1=\"319.0\" y1=\"33\" x2=\"319.0\" y2=\"42\" class=\"edge\"/><rect x=\"304.0\" y=\"43\" width=\"30\" height=\"28\" rx=\"5\" class=\"tile p3\"/><text x=\"319.0\" y=\"63\" class=\"tilet\" text-anchor=\"middle\">Z<\/text><rect x=\"344\" y=\"6\" width=\"34\" height=\"26\" rx=\"6\" class=\"chip\"/><text x=\"361.0\" y=\"24.0\" class=\"chiptxt \" text-anchor=\"middle\">I<\/text><line x1=\"361.0\" y1=\"33\" x2=\"361.0\" y2=\"42\" class=\"edge\"/><rect x=\"346.0\" y=\"43\" width=\"30\" height=\"28\" rx=\"5\" class=\"tile p3\"/><text x=\"361.0\" y=\"63\" class=\"tilet\" text-anchor=\"middle\">Z<\/text><\/svg><\/div><figcaption><p>Tag each one: X = first bag, Y = second bag, Z = third bag.<\/p><\/figcaption><\/figure><figure class=\"frame\" data-step=\"2\"><p class=\"ftitle\">2. Count with order, then remove it<\/p><div class=\"pic-wrap\"><div class=\"vstack\"><svg class=\"pic \" viewBox=\"0 0 281 76\" role=\"img\" aria-label=\"tag word\" style=\"max-width:407px\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"10\" y=\"6\" width=\"26\" height=\"28\" rx=\"4\" class=\"tile p5\"/><text x=\"23.0\" y=\"25.0\" class=\"tilet sm\" text-anchor=\"middle\">X<\/text><rect x=\"39\" y=\"6\" width=\"26\" height=\"28\" rx=\"4\" class=\"tile p5\"/><text x=\"52.0\" y=\"25.0\" class=\"tilet sm\" text-anchor=\"middle\">X<\/text><rect x=\"68\" y=\"6\" width=\"26\" height=\"28\" rx=\"4\" class=\"tile p5\"/><text x=\"81.0\" y=\"25.0\" class=\"tilet sm\" text-anchor=\"middle\">X<\/text><rect x=\"97\" y=\"6\" width=\"26\" height=\"28\" rx=\"4\" class=\"tile p5\"/><text x=\"110.0\" y=\"25.0\" class=\"tilet sm\" text-anchor=\"middle\">X<\/text><rect x=\"126\" y=\"6\" width=\"26\" height=\"28\" rx=\"4\" class=\"tile p6\"/><text x=\"139.0\" y=\"25.0\" class=\"tilet sm\" text-anchor=\"middle\">Y<\/text><rect x=\"155\" y=\"6\" width=\"26\" height=\"28\" rx=\"4\" class=\"tile p6\"/><text x=\"168.0\" y=\"25.0\" class=\"tilet sm\" text-anchor=\"middle\">Y<\/text><rect x=\"184\" y=\"6\" width=\"26\" height=\"28\" rx=\"4\" class=\"tile p6\"/><text x=\"197.0\" y=\"25.0\" class=\"tilet sm\" text-anchor=\"middle\">Y<\/text><rect x=\"213\" y=\"6\" width=\"26\" height=\"28\" rx=\"4\" class=\"tile p3\"/><text x=\"226.0\" y=\"25.0\" class=\"tilet sm\" text-anchor=\"middle\">Z<\/text><rect x=\"242\" y=\"6\" width=\"26\" height=\"28\" rx=\"4\" class=\"tile p3\"/><text x=\"255.0\" y=\"25.0\" class=\"tilet sm\" text-anchor=\"middle\">Z<\/text><text x=\"140.5\" y=\"58\" class=\"cap\" text-anchor=\"middle\">4 \u00d7 X,  3 \u00d7 Y,  2 \u00d7 Z<\/text><\/svg><svg class=\"pic \" viewBox=\"0 0 228 70\" role=\"img\" aria-label=\"count with order\" style=\"max-width:331px\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"10\" y=\"16\" width=\"44\" height=\"40\" rx=\"7\" class=\"numbox\"/><text x=\"32.0\" y=\"43\" class=\"calcn\" text-anchor=\"middle\">9!<\/text><text x=\"77.5\" y=\"44\" class=\"op\" text-anchor=\"middle\">=<\/text><rect x=\"101\" y=\"16\" width=\"109\" height=\"40\" rx=\"7\" class=\"result\"/><text x=\"155.5\" y=\"43\" class=\"calcn\" text-anchor=\"middle\">362,880<\/text><\/svg><\/div><\/div><figcaption><p>Count with order: the rule of product treats every tag as different and in a line. 9! = 362,880.<\/p><\/figcaption><\/figure><figure class=\"frame\" data-step=\"2\"><p class=\"ftitle\">2. Count with order, then remove it<\/p><div class=\"pic-wrap\"><svg class=\"pic \" viewBox=\"0 0 360 108\" role=\"img\" aria-label=\"remove the order\" style=\"max-width:522px\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"4\" y=\"4\" width=\"352\" height=\"100\" rx=\"10\" class=\"wcard \"/><text x=\"180.0\" y=\"32\" class=\"cardt\" text-anchor=\"middle\">X: counted 4! = 24 times<\/text><text x=\"180.0\" y=\"58\" class=\"cardt\" text-anchor=\"middle\">Y: counted 3! = 6 times<\/text><text x=\"180.0\" y=\"84\" class=\"cardt\" text-anchor=\"middle\">Z: counted 2! = 2 times<\/text><\/svg><\/div><figcaption><p>Remove the order inside each group (the teacher&#x27;s &#x27;groups whose order is being removed&#x27;): every group was counted once for each order of its members, and the copies multiply.<\/p><\/figcaption><\/figure><figure class=\"frame\" data-step=\"2\"><p class=\"ftitle\">2. Count with order, then remove it<\/p><div class=\"pic-wrap\"><svg class=\"pic \" viewBox=\"0 0 371 70\" role=\"img\" aria-label=\"remove the order\" style=\"max-width:538px\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"10\" y=\"16\" width=\"109\" height=\"40\" rx=\"7\" class=\"numbox\"/><text x=\"64.5\" y=\"43\" class=\"calcn\" text-anchor=\"middle\">362,880<\/text><text x=\"142.5\" y=\"44\" class=\"op\" text-anchor=\"middle\">\u00f7<\/text><rect x=\"166\" y=\"16\" width=\"57\" height=\"40\" rx=\"7\" class=\"numbox\"/><text x=\"194.5\" y=\"43\" class=\"calcn\" text-anchor=\"middle\">288<\/text><text x=\"246.5\" y=\"44\" class=\"op\" text-anchor=\"middle\">=<\/text><rect x=\"270\" y=\"16\" width=\"83\" height=\"40\" rx=\"7\" class=\"result\"/><text x=\"311.5\" y=\"43\" class=\"calcn\" text-anchor=\"middle\">1,260<\/text><\/svg><\/div><figcaption><p>362,880 \u00f7 288 = 1,260. The same as the tag-word formula 9! \u00f7 (4! \u00d7 3! \u00d7 2!).<\/p><\/figcaption><\/figure><figure class=\"frame\" data-step=\"2\"><p class=\"ftitle\">2. Count with order, then remove it<\/p><div class=\"pic-wrap\"><table class=\"ptable \"><thead><tr><th>bag<\/th><th>choose<\/th><th>ways<\/th><\/tr><\/thead><tbody><tr><td>bag X<\/td><td>4 from the 9 left<\/td><td>9C4 = 126<\/td><\/tr><tr><td>bag Y<\/td><td>3 from the 5 left<\/td><td>5C3 = 10<\/td><\/tr><tr><td>bag Z<\/td><td>2 from the 2 left<\/td><td>2C2 = 1<\/td><\/tr><\/tbody><\/table><\/div><figcaption><p>Same count, the class way (Example 1.4): fill one bag at a time, choosing from whoever is left. The last one takes the rest: k! \u00f7 (k! \u00d7 0!) = 1, because 0! = 1. 126 \u00d7 10 \u00d7 1 = 1,260.<\/p><\/figcaption><\/figure><figure class=\"frame\" data-step=\"2\"><p class=\"ftitle\">2. Count with order, then remove it<\/p><div class=\"pic-wrap\"><svg class=\"pic \" viewBox=\"0 0 563.0 140\" role=\"img\" aria-label=\"cancellation\" style=\"max-width:816px\" preserveAspectRatio=\"xMidYMid meet\"><text x=\"49.5\" y=\"40\" class=\"calcn\" text-anchor=\"middle\">9!<\/text><line x1=\"16\" y1=\"52\" x2=\"83\" y2=\"52\" class=\"fracline\"/><text x=\"49.5\" y=\"80\" class=\"calcn\" text-anchor=\"middle\">4!\u00b75!<\/text><text x=\"102\" y=\"60\" class=\"op\" text-anchor=\"middle\">\u00d7<\/text><text x=\"154.5\" y=\"40\" class=\"calcn\" text-anchor=\"middle\">5!<\/text><line x1=\"121\" y1=\"52\" x2=\"188\" y2=\"52\" class=\"fracline\"/><text x=\"154.5\" y=\"80\" class=\"calcn\" text-anchor=\"middle\">3!\u00b72!<\/text><text x=\"207\" y=\"60\" class=\"op\" text-anchor=\"middle\">\u00d7<\/text><text x=\"259.5\" y=\"40\" class=\"calcn\" text-anchor=\"middle\">2!<\/text><line x1=\"226\" y1=\"52\" x2=\"293\" y2=\"52\" class=\"fracline\"/><text x=\"259.5\" y=\"80\" class=\"calcn\" text-anchor=\"middle\">2!\u00b70!<\/text><line x1=\"53.0\" y1=\"88\" x2=\"81.0\" y2=\"66\" class=\"strike banned big\"/><line x1=\"139.5\" y1=\"46\" x2=\"169.5\" y2=\"24\" class=\"strike banned big\"/><line x1=\"158.0\" y1=\"88\" x2=\"186.0\" y2=\"66\" class=\"strike banned big\"/><line x1=\"244.5\" y1=\"46\" x2=\"274.5\" y2=\"24\" class=\"strike banned big\"/><text x=\"319\" y=\"60\" class=\"op\" text-anchor=\"middle\">=<\/text><rect x=\"339\" y=\"8\" width=\"172\" height=\"92\" rx=\"12\" class=\"groupbox\"/><text x=\"425.0\" y=\"40\" class=\"calcn\" text-anchor=\"middle\">9!<\/text><line x1=\"349\" y1=\"52\" x2=\"501\" y2=\"52\" class=\"fracline\"/><text x=\"425.0\" y=\"80\" class=\"calcn\" text-anchor=\"middle\">4! \u00b7 3! \u00b7 2!<\/text><text x=\"425.0\" y=\"118\" class=\"cap\" text-anchor=\"middle\">groups whose order is being removed<\/text><\/svg><\/div><figcaption><p>Write each choose as factorials: each bottom &#x27;left over&#x27; factorial is the next top, so the 5! and 2! cancel (struck in red). What&#x27;s left is 9! \u00f7 (4! \u00b7 3! \u00b7 2!): the groups whose order is being removed. Exactly step 2&#x27;s division.<\/p><\/figcaption><\/figure><figure class=\"frame\" data-step=\"3\"><p class=\"ftitle\">3. Look-alike groups?<\/p><div class=\"pic-wrap\"><svg class=\"pic \" viewBox=\"0 0 428 152\" role=\"img\" aria-label=\"same split\" style=\"max-width:621px\" preserveAspectRatio=\"xMidYMid meet\"><ellipse cx=\"214.0\" cy=\"68\" rx=\"210.0\" ry=\"62\" class=\"oval diff\"/><path d=\"M22 30 L96 30 Q104 96 59 104 Q14 96 22 30Z\" class=\"bag\"/><rect x=\"24\" y=\"38\" width=\"22\" height=\"18\" rx=\"6\" class=\"chip picked\"/><text x=\"35.0\" y=\"52.0\" class=\"chiptxt picked\" text-anchor kes\" style=\"max-width:377px\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"4\" y=\"4\" width=\"252\" height=\"48\" rx=\"10\" class=\"wcard \"/><text x=\"130.0\" y=\"32\" class=\"cardt\" text-anchor=\"middle\">No look-alike groups<\/text><\/svg><\/div><figcaption><p>Look-alike groups? No: take and leave are different tags, so a T can never trade places with an L. Nothing to divide.<\/p><\/figcaption><\/figure><figure class=\"frame\" data-step=\"4\"><p class=\"ftitle\">4. Check a tiny case<\/p><div class=\"pic-wrap\"><svg class=\"pic \" viewBox=\"0 0 406 42\" role=\"img\" aria-label=\"list\" style=\"max-width:589px\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"8\" y=\"6\" width=\"92\" height=\"24\" rx=\"5\" class=\"lcell\"/><text x=\"54.0\" y=\"23\" class=\"lt\" text-anchor=\"middle\">TTTL \u2192 ABC<\/text><rect x=\"106\" y=\"6\" width=\"92\" height=\"24\" rx=\"5\" class=\"lcell\"/><text x=\"152.0\" y=\"23\" class=\"lt\" text-anchor=\"middle\">TTLT \u2192 ABD<\/text><rect x=\"204\" y=\"6\" width=\"92\" height=\"24\" rx=\"5\" class=\"lcell\"/><text x=\"250.0\" y=\"23\" class=\"lt\" text-anchor=\"middle\">TLTT \u2192 ACD<\/text><rect x=\"302\" y=\"6\" width=\"92\" height=\"24\" rx=\"5\" class=\"lcell\"/><text x=\"348.0\" y=\"23\" class=\"lt\" text-anchor=\"middle\">LTTT \u2192 BCD<\/text><\/svg><\/div><figcaption><p>Tiny case: a square&#x27;s 4 corners. Words with 3 T and 1 L: 4 triangles, listed.<\/p><\/figcaption><\/figure><\/div><\/div><div class=\"story-ctl\"><span class=\"nav\"><button type=\"button\" class=\"btn\" data-act=\"back\">\u2190 Back<\/button> <button type=\"button\" class=\"btn primary\" data-act=\"next\">Next step \u2192<\/button><\/span><span class=\"dots\" role=\"group\" aria-label=\"Pictures\"><\/span><label><input type=\"checkbox\" class=\"showall\"> Show all steps<\/label><\/div><\/div>", "answer": "56", "check": "8 choose 3 = 56; checked: no 3 cube corners are collinear.", "concept": "c6", "inclass": "36:48", "above": false, "note": null, "figure": null}, {"id": "l9", "label": "Problem 3.2", "section": "Guided problems from class", "text": "There are 100 competitors at the national debating contest, 2 from each of the 50 states. In how many ways can 5 finalists be chosen if no state can have more than one finalist?", "steps": [{"q": "In how many ways can the 5 finalists be chosen? (A product of numbers is a fine answer.)", "type": "num", "ans": 67800320, "nudges": ["Plan step 1: what should get tagged first, the people or the states?", "Plan step 2: the state word has 5 T's and 45 L's. Then each chosen state has its own free choice.", "Plan step 3: can two finalists ever be look-alikes here?"], "hint": "Start with the most restricting part: tag each state T (has a finalist) or L. Then each chosen state picks A or B. Two separate words multiply.", "reveal": "50 choose 5 \u00d7 2\u2075 = 2,118,760 \u00d7 32 = 67,800,320.", "check": "Checked three ways in code (state-by-state count, inclusion\u2013exclusion, small-case brute force).", "ok": "States first, then people.", "named": {"75287520": "That's 100 choose 5. Some of those teams have both people from one state.", "2118760": "That chooses the states. Each state still has to pick its person.", "8136038400": "That picks the states in order. Does the order of states matter?", "32": "That's just the A/B choices.", "10": "That's 5 \u00d7 2."}, "ph": "number or expression", "special": null, "order": false}], "story": "<div class=\"story worked\" id=\"story9\" tabindex=\"0\" aria-label=\"Worked answer: Problem 3.2\" data-plan='[&quot;Tag every object&quot;, &quot;Count with order, then remove it&quot;, &quot;Look-alike groups?&quot;, &quot;Check a tiny case&quot;]'><div class=\"wbody\"><div class=\"plan-side\" aria-hidden=\"true\"><ol><li data-s=\"1\">Tag every object with a letter that says where it goes.<\/li><li data-s=\"2\">Count with order (the rule of product treats every tag as different and in a line), then remove the order: divide by each repeated tag&#x27;s repeats!. Two separate words multiply; separate cases add.<\/li><li data-s=\"3\">Look-alike groups (same size, no names)? Remove their order too: write the group word and divide by its repeats!.<\/li><li data-s=\"4\">Check a tiny case you can list.<\/li><\/ol><\/div><div class=\"wmain\"><div class=\"plan-strip\" aria-hidden=\"true\"><span data-s=\"1\">1<\/span><span data-s=\"2\">2<\/span><span data-s=\"3\">3<\/span><span data-s=\"4\">4<\/span><span class=\"stepname\"><\/span><\/div><figure class=\"frame\" data-step=\"1\"><p class=\"ftitle\">1. Tag every object<\/p><div class=\"pic-wrap\"><svg class=\"pic \" viewBox=\"0 0 502 104\" role=\"img\" aria-label=\"tagged objects\" style=\"max-width:728px\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"8\" y=\"6\" width=\"41\" height=\"26\" rx=\"6\" class=\"chip\"/><text x=\"28.5\" y=\"24.0\" class=\"chiptxt \" text-anchor=\"middle\">S1<\/text><line x1=\"28.5\" y1=\"33\" x2=\"28.5\" y2=\"42\" class=\"edge\"/><rect x=\"13.5\" y=\"43\" width=\"30\" height=\"28\" rx=\"5\" class=\"tile p1\"/><text x=\"28.5\" y=\"63\" class=\"tilet\" text-anchor=\"middle\">T<\/text><rect x=\"57\" y=\"6\" width=\"41\" height=\"26\" rx=\"6\" class=\"chip\"/><text x=\"77.5\" y=\"24.0\" class=\"chiptxt \" text-anchor=\"middle\">S2<\/text><line x1=\"77.5\" y1=\"33\" x2=\"77.5\" y2=\"42\" class=\"edge\"/><rect x=\"62.5\" y=\"43\" width=\"30\" height=\"28\" rx=\"5\" class=\"tile pl\"/><text x=\"77.5\" y=\"63\" class=\"tilet\" text-anchor=\"middle\">L<\/text><rect x=\"106\" y=\"6\" width=\"41\" height=\"26\" rx=\"6\" class=\"chip\"/><text x=\"126.5\" y=\"24.0\" class=\"chiptxt \" text-anchor=\"middle\">S3<\/text><line x1=\"126.5\" y1=\"33\" x2=\"126.5\" y2=\"42\" class=\"edge\"/><rect x=\"111.5\" y=\"43\" width=\"30\" height=\"28\" rx=\"5\" class=\"tile pl\"/><text x=\"126.5\" y=\"63\" class=\"tilet\" text-anchor=\"middle\">L<\/text><rect x=\"155\" y=\"6\" width=\"41\" height=\"26\" rx=\"6\" class=\"chip\"/><text x=\"175.5\" y=\"24.0\" cl " y2=\"42\" class=\"edge\"/><rect x=\"405.5\" y=\"43\" width=\"30\" height=\"28\" rx=\"5\" class=\"tile pl\"/><text x=\"420.5\" y=\"63\" class=\"tilet\" text-anchor=\"middle\">L<\/text><rect x=\"449\" y=\"6\" width=\"41\" height=\"26\" rx=\"6\" class=\"chip\"/><text x=\"469.5\" y=\"24.0\" class=\"chiptxt \" text-anchor=\"middle\">S10<\/text><line x1=\"469.5\" y1=\"33\" x2=\"469.5\" y2=\"42\" class=\"edge\"/><rect x=\"454.5\" y=\"43\" width=\"30\" height=\"28\" rx=\"5\" class=\"tile p1\"/><text x=\"469.5\" y=\"63\" class=\"tilet\" text-anchor=\"middle\">T<\/text><text x=\"251.0\" y=\"98\" class=\"cap\" text-anchor=\"middle\">the first 10 of the 50 states shown<\/text><\/svg><\/div><figcaption><p>Start with the most restricting part. Tag each state: T if it has a finalist, L if not. (10 of the 50 shown.)<\/p><\/figcaption><\/figure><figure class=\"frame\" data-step=\"1\"><p class=\"ftitle\">1. Tag every object<\/p><div class=\"pic-wrap\"><svg class=\"pic \" viewBox=\"0 0 257 82\" role=\"img\" aria-label=\"tagged objects\" style=\"max-width:373px\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"8\" y=\"6\" width=\"41\" height=\"26\" rx=\"6\" class=\"chip\"/><text x=\"28.5\" y=\"24.0\" class=\"chiptxt \" text-anchor=\"middle\">S1<\/text><line x1=\"28.5\" y1=\"33\" x2=\"28.5\" y2=\"42\" class=\"edge\"/><rect x=\"13.5\" y=\"43\" width=\"30\" height=\"28\" rx=\"5\" class=\"tile p2\"/><text x=\"28.5\" y=\"63\" class=\"tilet\" text-anchor=\"middle\">A<\/text><rect x=\"57\" y=\"6\" width=\"41\" height=\"26\" rx=\"6\" class=\"chip\"/><text x=\"77.5\" y=\"24.0\" class=\"chiptxt \" text-anchor=\"middle\">S4<\/text><line x1=\"77.5\" y1=\"33\" x2=\"77.5\" y2=\"42\" class=\"edge\"/><rect x=\"62.5\" y=\"43\" width=\"30\" height=\"28\" rx=\"5\" class=\"tile p3\"/><text x=\"77.5\" y=\"63\" class=\"tilet\" text-anchor=\"middle\">B<\/text><rect x=\"106\" y=\"6\" width=\"41\" height=\"26\" rx=\"6\" class=\"chip\"/><text x=\"126.5\" y=\"24.0\" class=\"chiptxt \" text-anchor=\"middle\">S5<\/text><line x1=\"126.5\" y1=\"33\" x2=\"126.5\" y2=\"42\" class=\"edge\"/><rect x=\"111.5\" y=\"43\" width=\"30\" height=\"28\" rx=\"5\" class=\"tile p3\"/><text x=\"126.5\" y=\"63\" class=\"tilet\" text-anchor=\"middle\">B<\/text><rect x=\"155\" y=\"6\" width=\"41\" height=\"26\" rx=\"6\" class=\"chip\"/><text x=\"175.5\" y=\"24.0\" class=\"chiptxt \" text-anchor=\"middle\">S8<\/text><line x1=\"175.5\" y1=\"33\" x2=\"175.5\" y2=\"42\" class=\"edge\"/><rect x=\"160.5\" y=\"43\" width=\"30\" height=\"28\" rx=\"5\" class=\"tile p2\"/><text x=\"175.5\" y=\"63\" class=\"tilet\" text-anchor=\"middle\">A<\/text><rect x=\"204\" y=\"6\" width=\"41\" height=\"26\" rx=\"6\" class=\"chip\"/><text x=\"224.5\" y=\"24.0\" class=\"chiptxt \" text-anchor=\"middle\">S10<\/text><line x1=\"224.5\" y1=\"33\" x2=\"224.5\" y2=\"42\" class=\"edge\"/><rect x=\"209.5\" y=\"43\" width=\"30\" height=\"28\" rx=\"5\" class=\"tile p2\"/><text x=\"224.5\" y=\"63\" class=\"tilet\" text-anchor=\"middle\">A<\/text><\/svg><\/div><figcaption><p>Then each chosen state tags its finalist: A or B.<\/p><\/figcaption><\/figure><figure class=\"frame\" data-step=\"2\"><p class=\"ftitle\">2. Count with order, then remove it<\/p><div class=\"pic-wrap\"><svg class=\"pic \" viewBox=\"0 0 540 70\" role=\"img\" aria-label=\"count with order\" style=\"max-width:783px\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"10\" y=\"16\" width=\"304\" height=\"40\" rx=\"7\" class=\"numbox\"/><text x=\"162.0\" y=\"43\" class=\"calcn\" text-anchor=\"middle\">50 \u00d7 49 \u00d7 48 \u00d7 47 \u00d7 46<\/text><text x=\"337.5\" y=\"44\" class=\"op\" text-anchor=\"middle\">=<\/text><rect x=\"361\" y=\"16\" width=\"161\" height=\"40\" rx=\"7\" class=\"result\"/><text x=\"441.5\" y=\"43\" class=\"calcn\" text-anchor=\"middle\">254,251,200<\/text><\/svg><\/div><figcaption><p>Count with order: pick the tagged ones one at a time. 50 \u00d7 49 \u00d7 48 \u00d7 47 \u00d7 46 = 254,251,200.<\/p><\/figcaption><\/figure><figure class=\"frame\" data-step=\"2\"><p class=\"ftitle\">2. Count with order, then remove it<\/p><div class=\"pic-wrap\"><svg class=\"pic \" viewBox=\"0 0 360 56\" role=\"img\" aria-label=\"remove the order\" style=\"max-width:522px\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"4\" y=\"4\" width=\"352\" height=\"48\" rx=\"10\" class=\"wcard \"/><text x=\"180.0\" y=\"32\" class=\"cardt\" text-anchor=\"middle\">T: counted 5! = 120 times<\/text><\/svg><\/div><figcaption><p>Remove the order inside each group: every group was counted once for each order of its members.<\/p><\/figcaption><\/figure><figure class=\"frame\" data-step=\"2\"><p class=\"ftitle\">2. Count with order, then remove it<\/p><div class=\"pic-wrap\"><svg class=\"pic \" viewBox=\"0 0 462 70\" role=\"img\" aria-label=\"remove the order\" style=\"max-width:670px\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"10\" y=\"16\" width=\"161\" height=\"40\" rx=\"7\" class=\"numbox\"/><text x=\"90.5\" y=\"43\" class=\"calcn\" text-anchor=\"middle\">254,251,200<\/text><text x=\"194.5\" y=\"44\" class=\"op\" text-anchor=\"middle\">\u00f7<\/text><rect x=\"218\" y=\"16\" width=\"44\" height=\"40\" rx=\"7\" class=\"numbox\"/><text x=\"240.0\" y=\"43\" class=\"calcn\" text-anchor=\"middle\">5!<\/text><text x=\"285.5\" y=\"44\" class=\"op\" text-anchor=\"middle\">=<\/text><rect x=\"309\" y=\"16\" width=\"135\" height=\"40\" rx=\"7\" class=\"result\"/><text x=\"376.5\" y=\"43\" class=\"calcn\" text-anchor=\"middle\">2,118,760<\/text><\/svg><\/div><figcaption><p>254,251,200 \u00f7 120 = 2,118,760. The same as the tag-word formula 50! \u00f7 (5! \u00d7 45!).<\/p><\/figcaption><\/figure><figure class=\"frame\" data-step=\"2\"><p class=\"ftitle\">2. Count with order, then remove it<\/p><div class=\"pic-wrap\"><svg class=\"pic \" viewBox=\"0 0 358 70\" role=\"img\" aria-label=\"count\" style=\"max-width:519px\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"10\" y=\"16\" width=\"239\" height=\"40\" rx=\"7\" class=\"numbox\"/><text x=\"129.5\" y=\"43\" class=\"calcn\" text-anchor=\"middle\">2 \u00d7 2 \u00d7 2 \u00d7 2 \u00d7 2<\/text><text x=\"272.5\" y=\"44\" class=\"op\" text-anchor=\"middle\">=<\/text><rect x=\"296\" y=\"16\" width=\"44\" height=\"40\" rx=\"7\" class=\"result\"/><text x=\"318.0\" y=\"43\" class=\"calcn\" text-anchor=\"middle\">32<\/text><\/svg><\/div><figcaption><p>Each of the 5 chosen states picks A or B, a free choice each time: 2 \u00d7 2 \u00d7 2 \u00d7 2 \u00d7 2 = 32.<\/p><\/figcaption><\/figure><figure class=\"frame\" data-step=\"2\"><p class=\"ftitle\">2. Count with order, then remove it<\/p><div class=\"pic-wrap\"><svg class=\"pic \" viewBox=\"0 0 449 70\" role=\"img\" aria-label=\"combine\" style=\"max-width:651px\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"10\" y=\"16\" width=\"135\" height=\"40\" rx=\"7\" class=\"numbox\"/><text x=\"77.5\" y=\"43\" class=\"calcn\" text-anchor=\"middle\">2,118,760<\/text><text x=\"168.5\" y=\"44\" class=\"op\" text-anchor=\"middle\">\u00d7<\/text><rect x=\"192\" y=\"16\" width=\"44\" height=\"40\" rx=\"7\" class=\"numbox\"/><text x=\"214.0\" y=\"43\" class=\"calcn\" text-anchor=\"middle\">32<\/text><text x=\"259.5\" y=\"44\" class=\"op\" text-anchor=\"middle\">=<\/text><rect x=\"283\" y=\"16\" width=\"148\" height=\"40\" rx=\"7\" class=\"result\"/><text x=\"357.0\" y=\"43\" class=\"calcn\" text-anchor=\"middle\">67,800,320<\/text><\/svg><\/div><figcaption><p>Every word of the first kind goes with every word of the second kind, so multiply.<\/p><\/figcaption><\/figure><figure class=\"frame\" data-step=\"3\"><p class=\"ftitle\">3. Look-alike groups?<\/p><div class=\"pic-wrap\"><svg class=\"pic \" viewBox=\"0 0 260 56\" role=\"img\" aria-label=\"no look-alikes\" style=\"max-width:377px\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"4\" y=\"4\" width=\"252\" height=\"48\" rx=\"10\" class=\"wcard \"/><text x=\"130.0\" y=\"32\" class=\"cardt\" text-anchor=\"middle\">No look-alike groups<\/text><\/svg><\/div><figcaption><p>Look-alike groups? No: every finalist is a different person from a different state. Nothing to divide.<\/p><\/figcaption><\/figure><figure class=\"frame\" data-step=\"4\"><p class=\"ftitle\">4. Check a tiny case<\/p><div class=\"pic-wrap\"><svg class=\"pic \" viewBox=\"0 0 302 102\" role=\"img\" aria-label=\"list\" style=\"max-width:438px\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"8\" y=\"6\" width=\"66\" height=\"24\" rx=\"5\" class=\"lcell\"/><text x=\"41.0\" y=\"23\" class=\"lt\" text-anchor=\"middle\">1A 2A<\/text><rect x=\"80\" y=\"6\" width=\"66\" height=\"24\" rx=\"5\" class=\"lcell\"/><text x=\"113.0\" y=\"23\" class=\"lt\" text-anchor=\"middle\">1A 2B<\/text><rect x=\"152\" y=\"6\" width=\"66\" height=\"24\" rx=\"5\" class=\"lcell\"/><text x=\"185.0\" y=\"23\" class=\"lt\" text-anchor=\"middle\">1B 2A<\/text><rect x=\"224\" y=\"6\" width=\"66\" height=\"24\" rx=\"5\" class=\"lcell\"/><text x=\"257.0\" y=\"23\" class=\"lt\" text-anchor=\"middle\">1B 2B<\/text><rect x=\"8\" y=\"36\" width=\"66\" height=\"24\" rx=\"5\" class=\"lcell\"/><text x=\"41.0\" y=\"53\" class=\"lt\" text-anchor=\"middle\">1A 3A<\/text><rect x=\"80\" y=\"36\" width=\"66\" height=\"24\" rx=\"5\" class=\"lcell\"/><text x=\"113.0\" y=\"53\" class=\"lt\" text-anchor=\"middle\">1A 3B<\/text><rect x=\"152\" y=\"36\" width=\"66\" height=\"24\" rx=\"5\" class=\"lcell\"/><text x=\"185.0\" y=\"53\" class=\"lt\" text-anchor=\"middle\">1B 3A<\/text><rect x=\"224\" y=\"36\" width=\"66\" height=\"24\" rx=\"5\" class=\"lcell\"/><text x=\"257.0\" y=\"53\" class=\"lt\" text-anchor=\"middle\">1B 3B<\/text><rect x=\"8\" y=\"66\" width=\"66\" height=\"24\" rx=\"5\" class=\"lcell\"/><text x=\"41.0\" y=\"83\" class=\"lt\" text-anchor=\"middle\">2A 3A<\/text><rect x=\"80\" y=\"66\" width=\"66\" height=\"24\" rx=\"5\" class=\"lcell\"/><text x=\"113.0\" y=\"83\" class=\"lt\" text-anchor=\"middle\">2A 3B<\/text><rect x=\"152\" y=\"66\" width=\"66\" height=\"24\" rx=\"5\" class=\"lcell\"/><text x=\"185.0\" y=\"83\" class=\"lt\" text-anchor=\"middle\">2B 3A<\/text><rect x=\"224\" y=\"66\" width=\"66\" height=\"24\" rx=\"5\" class=\"lcell\"/><text x=\"257.0\" y=\"83\" class=\"lt\" text-anchor=\"middle\">2B 3B<\/text><\/svg><\/div><figcaption><p>Tiny case: 3 states, 2 finalists. State words TTL: 3; finalist choices 2 \u00d7 2 = 4; 3 \u00d7 4 = 12, listed.<\/p><\/figcaption><\/figure><\/div><\/div><div class=\"story-ctl\"><span class=\"nav\"><button type=\"button\" class=\"btn\" data-act=\"back\">\u2190 Back<\/button> <button type=\"button\" class=\"btn primary\" data-act=\"next\">Next step \u2192<\/button><\/span><span class=\"dots\" role=\"group\" aria-label=\"Pictures\"><\/span><label><input type=\"checkbox\" class=\"showall\"> Show all steps<\/label><\/div><\/div>", "answer": "67,800,320", "check": "50 choose 5 \u00d7 2\u2075 = 2,118,760 \u00d7 32 = 67,800,320 (the teacher's form: 2\u2075 \u00d7 20 \u00d7 49 \u00d7 47 \u00d7 46).", "concept": "c7", "inclass": "54:06", "above": true, "note": null, "figure": null}], "concepts": {"c1": "<h2>Words with repeated letters<\/h2><div class=\"eq\" role=\"math\">words = <span class=\"frac\"><span>n!<\/span><span>a! \u00d7 b! \u00d7 \u2026<\/span><\/span><\/div><p class=\"idea\">A word&#x27;s letters can be shuffled n! ways, but shuffling identical letters changes nothing, so divide by each letter&#x27;s repeats!.<\/p><div class=\"story concept\" id=\"story10\" tabindex=\"0\" aria-label=\"Words with repeated letters story\"><figure class=\"frame\"><div class=\"pic-wrap\"><svg class=\"pic \" viewBox=\"0 0 380 82\" role=\"img\" aria-label=\"the teacher&#x27;s rule\" style=\"max-width:551px\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"4\" y=\"4\" width=\"372\" height=\"74\" rx=\"10\" class=\"wcard \"/><text x=\"190.0\" y=\"32\" class=\"cardt\" text-anchor=\"middle\">Rule of product creates order<\/text><text x=\"190.0\" y=\"58\" class=\"cardt\" text-anchor=\"middle\">and treats objects as being distinct<\/text><\/svg><\/div><figcaption><p>The teacher&#x27;s opening rule. Multiplying choices (5 \u00d7 4 \u00d7 3 \u00d7 \u2026) always counts as if things were in a line and all different. When they aren&#x27;t, we fix the overcount.<\/p><div class=\"ask\"><b>Ask him:<\/b> In a word like A, A, A, B, C, which of those two things isn&#x27;t true?<\/div><\/figcaption><\/figure><figure class=\"frame\"><div class=\"pic-wrap\"><svg class=\"pic \" viewBox=\"0 0 190 50\" role=\"img\" aria-label=\"tiles\" style=\"max-width:276px\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"10\" y=\"8\" width=\"30\" height=\"30\" rx=\"5\" class=\"tile p1\"/><text x=\"25.0\" y=\"29.0\" class=\"tilet\" text-anchor=\"middle\">A<\/text><rect x=\"44\" y=\"8\" width=\"30\" height=\"30\" rx=\"5\" class=\"tile p1\"/><text x=\"59.0\" y=\"29.0\" class=\"tilet\" text-anchor=\"middle\">A<\/text><rect x=\"78\" y=\"8\" width=\"30\" height=\"30\" rx=\"5\" class=\"tile p3\"/><text x=\"93.0\" y=\"29.0\" class=\"tilet\" text-anchor=\"middle\">B<\/text><rect x=\"112\" y=\"8\" width=\"30\" height=\"30\" rx=\"5\" class=\"tile p1\"/><text x=\"127.0\" y=\"29.0\" class=\"tilet\" text-anchor=\"middle\">A<\/text><rect x=\"146\" y=\"8\" width=\"30\" height=\"30\" rx=\"5\" class=\"tile p4\"/><text x=\"161.0\" y=\"29.0\" class=\"tilet\" text-anchor=\"middle\">C<\/text><\/svg><\/div><figcaption><p>His recall example: arrange the letters A, A, A, B, C. One arrangement is A A B A C.<\/p><\/figcaption><\/figure><figure class=\"frame\"><div class=\"pic-wrap\"><svg class=\"pic \" viewBox=\"0 0 176 92\" role=\"img\" aria-label=\"tempting\" style=\"max-width:255px\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"10\" y=\"16\" width=\"44\" height=\"40\" rx=\"7\" class=\"numbox\"/><text x=\"32.0\" y=\"43\" class=\"calcn\" text-anchor=\"middle\">5!<\/text><text x=\"77.5\" y=\"44\" class=\"op\" text-anchor=\"middle\">=<\/text><rect x=\"101\" y=\"16\" width=\"57\" height=\"40\" rx=\"7\" class=\"result\"/><text x=\"129.5\" y=\"43\" class=\"calcn\" text-anchor=\"middle\">120<\/text><line x1=\"6\" y1=\"60\" x2=\"170\" y2=\"12\" class=\"strike banned big\"/><text x=\"88.0\" y=\"86\" class=\"cap\" text-anchor=\"middle\">treats the three A&#x27;s as different letters<\/text><\/svg><\/div><figcaption><p>The rule of product says 5 \u00d7 4 \u00d7 3 \u00d7 2 \u00d7 1 = 120. But that treats the A&#x27;s as distinct, and they aren&#x27;t.<\/p><\/figcaption><\/figure><figure class=\"frame\"><div class=\"pic-wrap\"><svg class=\"pic \" viewBox=\"0 0 190 50\" role=\"img\" aria-label=\"tiles\" style=\"max-width:276px\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"10\" y=\"8\" width=\"30\" height=\"30\" rx=\"5\" class=\"tile p1\"/><text x=\"25.0\" y=\"29.0\" class=\"tilet\" text-anchor=\"middle\">A<tspan class=\"sub\" dy=\"4\">1<\/tspan><tspan dy=\"-4\"><\/tspan><\/text><rect x=\"44\" y=\"8\" width=\"30\" height=\"30\" rx=\"5\" class=\"tile p2\"/><text x=\"59.0\" y=\"29.0\" class=\"tilet\" text-anchor=\"middle\">A<tspan class=\"sub\" dy=\"4\">2<\/tspan><tspan dy=\"-4\"><\/tspan><\/text><rect x=\"78\" y=\"8\" width=\"30\" height=\"30\" rx=\"5\" class=\"tile p3\"/><text x=\"93.0\" y=\"29.0\" class=\"tilet\" text-anchor=\"middle\">B<\/text><rect x=\"112\" y=\"8\" width=\"30\" height=\"30\" rx=\"5\" class=\"tile p5\"/><text x=\"127.0\" y=\"29.0\" class=\"tilet\" text-anchor=\"middle\">A<tspan class=\"sub\" dy=\"4\">3<\/tspan><tspan dy=\"-4\"><\/tspan><\/text><rect x=\"146\" y=\"8\" width=\"30\" height=\"30\" rx=\"5\" class=\"tile p4\"/><text x=\"161.0\" y=\"29.0\" class=\"tilet\" text-anchor=\"middle\">C<\/text><\/svg><\/div><figcaption><p>So make the rule true: paint the A&#x27;s A\u2081, A\u2082, A\u2083. Now all 5 letters are different and there really are 120 painted words.<\/p><\/figcaption><\/figure><figure class=\"frame\"><div class=\"pic-wrap\"><svg class=\"pic \" viewBox=\"0 0 294 242\" role=\"img\" aria-label=\"copies collapse\" style=\"max-width:426px\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"10\" y=\"8\" width=\"26\" \" width=\"26\" height=\"26\" rx=\"4\" class=\"tile p1\"/><text x=\"23.0\" y=\"128.0\" class=\"tilet sm\" text-anchor=\"middle\">A<tspan class=\"sub\" dy=\"4\">2<\/tspan><tspan dy=\"-4\"><\/tspan><\/text><rect x=\"39\" y=\"110\" width=\"26\" height=\"26\" rx=\"4\" class=\"tile p2\"/><text x=\"52.0\" y=\"128.0\" class=\"tilet sm\" text-anchor=\"middle\">A<tspan class=\"sub\" dy=\"4\">3<\/tspan><tspan dy=\"-4\"><\/tspan><\/text><rect x=\"68\" y=\"110\" width=\"26\" height=\"26\" rx=\"4\" class=\"tile p5\"/><text x=\"81.0\" y=\"128.0\" class=\"tilet sm\" text-anchor=\"middle\">A<tspan class=\"sub\" dy=\"4\">1<\/tspan><tspan dy=\"-4\"><\/tspan><\/text><rect x=\"10\" y=\"144\" width=\"26\" height=\"26\" rx=\"4\" class=\"tile p1\"/><text x=\"23.0\" y=\"162.0\" class=\"tilet sm\" text-anchor=\"middle\">A<tspan class=\"sub\" dy=\"4\">3<\/tspan><tspan dy=\"-4\"><\/tspan><\/text><rect x=\"39\" y=\"144\" width=\"26\" height=\"26\" rx=\"4\" class=\"tile p2\"/><text x=\"52.0\" y=\"162.0\" class=\"tilet sm\" text-anchor=\"middle\">A<tspan class=\"sub\" dy=\"4\">1<\/tspan><tspan dy=\"-4\"><\/tspan><\/text><rect x=\"68\" y=\"144\" width=\"26\" height=\"26\" rx=\"4\" class=\"tile p5\"/><text x=\"81.0\" y=\"162.0\" class=\"tilet sm\" text-anchor=\"middle\">A<tspan class=\"sub\" dy=\"4\">2<\/tspan><tspan dy=\"-4\"><\/tspan><\/text><rect x=\"10\" y=\"178\" width=\"26\" height=\"26\" rx=\"4\" class=\"tile p1\"/><text x=\"23.0\" y=\"196.0\" class=\"tilet sm\" text-anchor=\"middle\">A<tspan class=\"sub\" dy=\"4\">3<\/tspan><tspan dy=\"-4\"><\/tspan><\/text><rect x=\"39\" y=\"178\" width=\"26\" height=\"26\" rx=\"4\" class=\"tile p2\"/><text x=\"52.0\" y=\"196.0\" class=\"tilet sm\" text-anchor=\"middle\">A<tspan class=\"sub\" dy=\"4\">2<\/tspan><tspan dy=\"-4\"><\/tspan><\/text><rect x=\"68\" y=\"178\" width=\"26\" height=\"26\" rx=\"4\" class=\"tile p5\"/><text x=\"81.0\" y=\"196.0\" class=\"tilet sm\" text-anchor=\"middle\">A<tspan class=\"sub\" dy=\"4\">1<\/tspan><tspan dy=\"-4\"><\/tspan><\/text><path d=\"M105 8 q10 0 10 10 L115 98.0 q0 8 10 8 q-10 0 -10 8 L115 194 q0 10 -10 10\" class=\"brace\"/><path d=\"M131 106.0 L163 106.0\" class=\"arrow\" marker-end=\"url(#ac16)\"/><defs><marker id=\"ac16\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10z\" class=\"ahead\"/><\/marker><\/defs><rect x=\"171\" y=\"93.0\" width=\"26\" height=\"26\" rx=\"4\" class=\"tile real\"/><text x=\"184.0\" y=\"111.0\" class=\"tilet sm\" text-anchor=\"middle\">A<\/text><rect x=\"200\" y=\"93.0\" width=\"26\" height=\"26\" rx=\"4\" class=\"tile real\"/><text x=\"213.0\" y=\"111.0\" class=\"tilet sm\" text-anchor=\"middle\">A<\/text><rect x=\"229\" y=\"93.0\" width=\"26\" height=\"26\" rx=\"4\" class=\"tile real\"/><text x=\"242.0\" y=\"111.0\" class=\"tilet sm\" text-anchor=\"middle\">A<\/text><text x=\"214.5\" y=\"135.0\" class=\"cap\" text-anchor=\"middle\">6 \u2192 1<\/text><text x=\"147.0\" y=\"236\" class=\"cap\" text-anchor=\"middle\">3! = 6 painted orders \u2192 1<\/text><\/svg><\/div><figcaption><p>Wash off the paint. Every real word came from 3! = 6 painted orders of the A&#x27;s.<\/p><\/figcaption><\/figure><figure class=\"frame\"><div class=\"pic-wrap\"><svg class=\"pic \" viewBox=\"0 0 267 70\" role=\"img\" aria-label=\"divide\" style=\"max-width:387px\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"10\" y=\"16\" width=\"57\" height=\"40\" rx=\"7\" class=\"numbox\"/><text x=\"38.5\" y=\"43\" class=\"calcn\" text-anchor=\"middle\">120<\/text><text x=\"90.5\" y=\"44\" class=\"op\" text-anchor=\"middle\">\u00f7<\/text><rect x=\"114\" y=\"16\" width=\"44\" height=\"40\" rx=\"7\" class=\"numbox\"/><text x=\"136.0\" y=\"43\" class=\"calcn\" text-anchor=\"middle\">3!<\/text><text x=\"181.5\" y=\"44\" class=\"op\" text-anchor=\"middle\">=<\/text><rect x=\"205\" y=\"16\" width=\"44\" height=\"40\" rx=\"7\" class=\"result\"/><text x=\"227.0\" y=\"43\" class=\"calcn\" text-anchor=\"middle\">20<\/text><\/svg><\/div><figcaption><p>Fix the overcount: 120 \u00f7 6 = 20 real arrangements of A, A, A, B, C.<\/p><\/figcaption><\/figure><figure class=\"frame\"><div class=\"pic-wrap\"><svg class=\"pic \" viewBox=\"0 0 236 112\" role=\"img\" aria-label=\"copies collapse\" style=\"max-width:342px\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"10\" y=\"8\" width=\"26\" height=\"26\" rx=\"4\" class=\"tile p1\"/><text x=\"23.0\" y=\"26.0\" class=\"tilet sm\" text-anchor=\"middle\">A<tspan class=\"sub\" dy=\"4\">1<\/tspan><tspan dy=\"-4\"><\/tspan><\/text><rect x=\"39\" y=\"8\" width=\"26\" height=\"26\" rx=\"4\" class=\"tile p2\"/><text x=\"52.0\" y=\"26.0\" class=\"tilet sm\" text-anchor=\"middle\">A<tspan class=\"sub\" dy=\"4\">2<\/tspan><tspan dy=\"-4\"><\/tspan><\/text><rect x=\"10\" y=\"42\" width=\"26\" height=\"26\" rx=\"4\" class=\"tile p1\"/><text x=\"23.0\" y=\"60.0\" class=\"tilet sm\" text-anchor=\"middle\">A<tspan class=\"sub\" dy=\"4\">2<\/tspan><tspan dy=\"-4\"><\/tspan><\/text><rect x=\"39\" y=\"42\" width=\"26\" height=\"26\" rx=\"4\" class=\"tile p2\"/><text x=\"52.0\" y=\"60.0\" class=\"tilet sm\" text-anchor=\"middle\">A<tspan class=\"sub\" dy=\"4\">1<\/tspan><tspan dy=\"-4\"><\/tspan><\/text><path d=\"M76 8 q10 0 10 10 L86 30.0 q0 8 10 8 q-10 0 -10 8 L86 58 q0 10 -10 10\" class=\"brace\"/><path d=\"M102 38.0 L134 38.0\" class=\"arrow\" marker-end=\"url(#ac17)\"/><defs><marker id=\"ac17\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10z\" class=\"ahead\"/><\/marker><\/defs><rect x=\"142\" y=\"25.0\" width=\"26\" height=\"26\" rx=\"4\" class=\"tile real\"/><text x=\"155.0\" y=\"43.0\" class=\"tilet sm\" text-anchor=\"middle\">A<\/text><rect x=\"171\" y=\"25.0\" width=\"26\" height=\"26\" rx=\"4\" class=\"tile real\"/><text x=\"184.0\" y=\"43.0\" class=\"tilet sm\" text-anchor=\"middle\">A<\/text><text x=\"171.0\" y=\"67.0\" class=\"cap\" text-anchor=\"middle\">2 \u2192 1<\/text><text x=\"118.0\" y=\"106\" class=\"cap\" text-anchor=\"middle\">\u00d7 3! = 6 orders of the B&#x27;s too<\/text><\/svg><\/div><figcaption><p>Two repeated letters, like A A B B B: each word came from 2 orders of the A&#x27;s times 6 orders of the B&#x27;s, so 12 copies (multiply, don&#x27;t add): 120 \u00f7 12 = 10.<\/p><\/figcaption><\/figure><figure class=\"frame\"><div class=\"pic-wrap\"><table class=\"ptable \"><thead><tr><th>letters<\/th><th>words<\/th><\/tr><\/thead><tbody><tr><td>AB<\/td><td>2<\/td><\/tr><tr><td>AAB<\/td><td>3<\/td><\/tr><tr><td>AABB<\/td><td>6<\/td><\/tr><tr><td>AABBB<\/td><td>10<\/td><\/tr><tr class=\"hl\"><td>AAABBB<\/td><td>?<\/td><\/tr><\/tbody><\/table><\/div><figcaption><p>Fill in the last row.<\/p><\/figcaption><\/figure><figure class=\"frame\"><div class=\"pic-wrap\"><svg class=\"pic \" viewBox=\"0 0 360 56\" role=\"img\" aria-label=\"rule\" style=\"max-width:522px\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"4\" y=\"4\" width=\"352\" height=\"48\" rx=\"10\" class=\"wcard \"/><text x=\"180.0\" y=\"32\" class=\"cardt\" text-anchor=\"middle\">words = n! \u00f7 (each letter&#x27;s repeats)!<\/text><\/svg><\/div><figcaption><p>Rule: n! on top, a factorial for each repeated letter underneath.<\/p><\/figcaption><\/figure><div class=\"story-ctl\"><span class=\"nav\"><button type=\"button\" class=\"btn\" data-act=\"back\">\u2190 Back<\/button> <button type=\"button\" class=\"btn primary\" data-act=\"next\">Next step \u2192<\/button><\/span><span class=\"dots\" role=\"group\" aria-label=\"Pictures\"><\/span><label><input type=\"checkbox\" class=\"showall\"> Show all steps<\/label><\/div><\/div>", "c2": "<h2>Choosing: tag T or L<\/h2><div class=\"eq\" role=\"math\"><span class=\"binom\"><span>n<\/span><span>k<\/span><\/span> = <span class=\"frac\"><span>n!<\/span><span>k! \u00d7 (n \u2212 k)!<\/span><\/span> <span class=\"eqnote\">a word with k T\u2019s and n \u2212 k L\u2019s<\/span><\/div><p class=\"idea\">Choosing k things from n \" height=\"26\" rx=\"6\" class=\"chip\"/><text x=\"25.0\" y=\"24.0\" class=\"chiptxt \" text-anchor=\"middle\">S1<\/text><line x1=\"25.0\" y1=\"33\" x2=\"25.0\" y2=\"42\" class=\"edge\"/><rect x=\"10.0\" y=\"43\" width=\"30\" height=\"28\" rx=\"5\" class=\"tile p1\"/><text x=\"25.0\" y=\"63\" class=\"tilet\" text-anchor=\"middle\">T<\/text><rect x=\"50\" y=\"6\" width=\"34\" height=\"26\" rx=\"6\" class=\"chip\"/><text x=\"67.0\" y=\"24.0\" class=\"chiptxt \" text-anchor=\"middle\">S2<\/text><line x1=\"67.0\" y1=\"33\" x2=\"67.0\" y2=\"42\" class=\"edge\"/><rect x=\"52.0\" y=\"43\" width=\"30\" height=\"28\" rx=\"5\" class=\"tile p1\"/><text x=\"67.0\" y=\"63\" class=\"tilet\" text-anchor=\"middle\">T<\/text><rect x=\"92\" y=\"6\" width=\"34\" height=\"26\" rx=\"6\" class=\"chip\"/><text x=\"109.0\" y=\"24.0\" class=\"chiptxt \" text-anchor=\"middle\">S3<\/text><line x1=\"109.0\" y1=\"33\" x2=\"109.0\" y2=\"42\" class=\"edge\"/><rect x=\"94.0\" y=\"43\" width=\"30\" height=\"28\" rx=\"5\" class=\"tile pl\"/><text x=\"109.0\" y=\"63\" class=\"tilet\" text-anchor=\"middle\">L<\/text><rect x=\"134\" y=\"6\" width=\"34\" height=\"26\" rx=\"6\" class=\"chip\"/><text x=\"151.0\" y=\"24.0\" class=\"chiptxt \" text-anchor=\"middle\">S4<\/text><line x1=\"151.0\" y1=\"33\" x2=\"151.0\" y2=\"42\" class=\"edge\"/><rect x=\"136.0\" y=\"43\" width=\"30\" height=\"28\" rx=\"5\" class=\"tile p1\"/><text x=\"151.0\" y=\"63\" class=\"tilet\" text-anchor=\"middle\">T<\/text><\/svg><\/div><figcaption><p>Start with the most restricting part. First word: tag each state T (has a finalist) or L. Words TTTL: 4.<\/p><\/figcaption><\/figure><figure class=\"frame\"><div class=\"pic-wrap\"><svg class=\"pic \" viewBox=\"0 0 138 82\" role=\"img\" aria-label=\"tagged objects\" style=\"max-width:200px\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"8\" y=\"6\" width=\"34\" height=\"26\" rx=\"6\" class=\"chip\"/><text x=\"25.0\" y=\"24.0\" class=\"chiptxt \" text-anchor=\"middle\">S1<\/text><line x1=\"25.0\" y1=\"33\" x2=\"25.0\" y2=\"42\" class=\"edge\"/><rect x=\"10.0\" y=\"43\" width=\"30\" height=\"28\" rx=\"5\" class=\"tile p2\"/><text x=\"25.0\" y=\"63\" class=\"tilet\" text-anchor=\"middle\">A<\/text><rect x=\"50\" y=\"6\" width=\"34\" height=\"26\" rx=\"6\" class=\"chip\"/><text x=\"67.0\" y=\"24.0\" class=\"chiptxt \" text-anchor=\"middle\">S2<\/text><line x1=\"67.0\" y1=\"33\" x2=\"67.0\" y2=\"42\" class=\"edge\"/><rect x=\"52.0\" y=\"43\" width=\"30\" height=\"28\" rx=\"5\" class=\"tile p3\"/><text x=\"67.0\" y=\"63\" class=\"tilet\" text-anchor=\"middle\">B<\/text><rect x=\"92\" y=\"6\" width=\"34\" height=\"26\" rx=\"6\" class=\"chip\"/><text x=\"109.0\" y=\"24.0\" class=\"chiptxt \" text-anchor=\"middle\">S4<\/text><line x1=\"109.0\" y1=\"33\" x2=\"109.0\" y2=\"42\" class=\"edge\"/><rect x=\"94.0\" y=\"43\" width=\"30\" height=\"28\" rx=\"5\" class=\"tile p2\"/><text x=\"109.0\" y=\"63\" class=\"tilet\" text-anchor=\"middle\">A<\/text><\/svg><\/div><figcaption><p>Second word: each chosen state tags its person A or B: 2 \u00d7 2 \u00d7 2 = 8.<\/p><\/figcaption><\/figure><figure class=\"frame\"><div class=\"pic-wrap\"><svg class=\"pic \" viewBox=\"0 0 228 70\" role=\"img\" aria-label=\"multiply\" style=\"max-width:331px\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"10\" y=\"16\" width=\"31\" height=\"40\" rx=\"7\" class=\"numbox\"/><text x=\"25.5\" y=\"43\" class=\"calcn\" text-anchor=\"middle\">4<\/text><text x=\"64.5\" y=\"44\" class=\"op\" text-anchor=\"middle\">\u00d7<\/text><rect x=\"88\" y=\"16\" width=\"31\" height=\"40\" rx=\"7\" class=\"numbox\"/><text x=\"103.5\" y=\"43\" class=\"calcn\" text-anchor=\"middle\">8<\/text><text x=\"142.5\" y=\"44\" class=\"op\" text-anchor=\"middle\">=<\/text><rect x=\"166\" y=\"16\" width=\"44\" height=\"40\" rx=\"7\" class=\"result\"/><text x=\"188.0\" y=\"43\" class=\"calcn\" text-anchor=\"middle\">32<\/text><\/svg><\/div><figcaption><p>Two separate words: every state word goes with every A/B word. 4 \u00d7 8 = 32.<\/p><\/figcaption><\/figure><figure class=\"frame\"><div class=\"pic-wrap\"><div class=\"vstack\"><svg class=\"pic \" viewBox=\"0 0 290 94\" role=\"img\" aria-label=\"list\" style=\"max-width:420px\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"8\" y=\"6\" width=\"86\" height=\"24\" rx=\"5\" class=\"lcell\"/><text x=\"51.0\" y=\"23\" class=\"lt\" text-anchor=\"middle\">R1 R2 B1<\/text><rect x=\"100\" y=\"6\" width=\"86\" height=\"24\" rx=\"5\" class=\"lcell\"/><text x=\"143.0\" y=\"23\" class=\"lt\" text-anchor=\"middle\">R1 R2 B2<\/text><rect x=\"192\" y=\"6\" width=\"86\" height=\"24\" rx=\"5\" class=\"lcell\"/><text x=\"235.0\" y=\"23\" class=\"lt\" text-anchor=\"middle\">R1 R3 B1<\/text><rect x=\"8\" y=\"36\" width=\"86\" height=\"24\" rx=\"5\" class=\"lcell\"/><text x=\"51.0\" y=\"53\" class=\"lt\" text-anchor=\"middle\">R1 R3 B2<\/text><rect x=\"100\" y=\"36\" width=\"86\" height=\"24\" rx=\"5\" class=\"lcell\"/><text x=\"143.0\" y=\"53\" class=\"lt\" text-anchor=\"middle\">R2 R3 B1<\/text><rect x=\"192\" y=\"36\" width=\"86\" height=\"24\" rx=\"5\" class=\"lcell\"/><text x=\"235.0\" y=\"53\" class=\"lt\" text-anchor=\"middle\">R2 R3 B2<\/text><text x=\"145.0\" y=\"88\" class=\"cap\" text-anchor=\"middle\">2 red + 1 blue: 6<\/text><\/svg><svg class=\"pic \" viewBox=\"0 0 290 64\" role=\"img\" aria-label=\"list\" style=\"max-width:420px\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"8\" y=\"6\" width=\"86\" height=\"24\" rx=\"5\" class=\"lcell\"/><text x=\"51.0\" y=\"23\" class=\"lt\" text-anchor=\"middle\">R1 B1 B2<\/text><rect x=\"100\" y=\"6\" width=\"86\" height=\"24\" rx=\"5\" class=\"lcell\"/><text x=\"143.0\" y=\"23\" class=\"lt\" text-anchor=\"middle\">R2 B1 B2<\/text><rect x=\"192\" y=\"6\" width=\"86\" height=\"24\" rx=\"5\" class=\"lcell\"/><text x=\"235.0\" y=\"23\" class=\"lt\" text-anchor=\"middle\">R3 B1 B2<\/text><text x=\"145.0\" y=\"58\" class=\"cap\" text-anchor=\"middle\">1 red + 2 blue: 3<\/text><\/svg><\/div><\/div><figcaption><p>Different idea: 3-person teams with both colours from R1, R2, R3, B1, B2. Two cases, uneven in size.<\/p><\/figcaption><\/figure><figure class=\"frame\"><div class=\"pic-wrap\"><svg class=\"pic \" viewBox=\"0 0 215 70\" role=\"img\" aria-label=\"add\" style=\"max-width:312px\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"10\" y=\"16\" width=\"31\" height=\"40\" rx=\"7\" class=\"numbox\"/><text x=\"25.5\" y=\"43\" class=\"calcn\" text-anchor=\"middle\">6<\/text><text x=\"64.5\" y=\"44\" class=\"op\" text-anchor=\"middle\">+<\/text><rect x=\"88\" y=\"16\" width=\"31\" height=\"40\" rx=\"7\" class=\"numbox\"/><text x=\"103.5\" y=\"43\" class=\"calcn\" text-anchor=\"middle\">3<\/text><text x=\"142.5\" y=\"44\" class=\"op\" text-anchor=\"middle\">=<\/text><rect x=\"166\" y=\"16\" width=\"31\" height=\"40\" rx=\"7\" class=\"result\"/><text x=\"181.5\" y=\"43\" class=\"calcn\" text-anchor=\"middle\">9<\/text><\/svg><\/div><figcaption><p>A team is one case or the other, never both, so add: 9.<\/p><div class=\"ask\"><b>Ask him:<\/b> Why add here, but multiply for the states?<\/div><\/figcaption><\/figure><figure class=\"frame\"><div class=\"pic-wrap\"><table class=\"ptable \"><thead><tr><th>situation<\/th><th>move<\/th><\/tr><\/thead><tbody><tr class=\"hl\"><td>two separate parts<\/td><td>two words: multiply<\/td><\/tr><tr><td>kinds that can&#x27;t overlap<\/td><td>cases: add<\/td><\/tr><tr><td>a rule like &#x27;one per state&#x27;<\/td><td>tag the restricted part first<\/td><\/tr><\/tbody><\/table><\/div><figcaption><p>The moves for problems with rules.<\/p><\/figcaption><\/figure><div class=\"story-ctl\"><span class=\"nav\"><button type=\"button\" class=\"btn\" data-act=\"back\">\u2190 Back<\/button> <button type=\"button\" class=\"btn primary\" data-act=\"next\">Next step \u2192<\/button><\/span><span class=\"dots\" role=\"group\" aria-label=\"Pictures\"><\/span><label><input type=\"checkbox\" class=\"showall\"> Show all steps<\/label><\/div><\/div>"}}</
