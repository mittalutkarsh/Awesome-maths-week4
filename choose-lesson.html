<script>
/* Answer checker. Parses numbers and expressions exactly (BigInt rationals), so 2^5*20*49*47*46,
   11!/(4!4!2!), 3×2⁹, 10 choose 3, C(10,3), 10C3 and "1,260" all work. */
window.CHECK = (function () {
  "use strict";
  function gcd(a, b) { a = a < 0n ? -a : a; b = b < 0n ? -b : b; while (b) { [a, b] = [b, a % b]; } return a; }
  function R(n, d) { d = d === undefined ? 1n : d; if (d === 0n) throw new Error("divide by zero"); if (d < 0n) { n = -n; d = -d; } const g = gcd(n, d) || 1n; return { n: n / g, d: d / g }; }
  const add = (a, b) => R(a.n * b.d + b.n * a.d, a.d * b.d);
  const sub = (a, b) => R(a.n * b.d - b.n * a.d, a.d * b.d);
  const mul = (a, b) => R(a.n * b.n, a.d * b.d);
  const div = (a, b) => R(a.n * b.d, a.d * b.n);
  const isInt = (a) => a.d === 1n;
  function fact(a) { if (!isInt(a) || a.n < 0n || a.n > 300n) throw new Error("factorial"); let r = 1n; for (let i = 2n; i <= a.n; i++) r *= i; return R(r); }
  function pow(a, b) {
    if (!isInt(b) || b.n < 0n || b.n > 2000n) throw new Error("power");
    let r = 1n, rd = 1n; for (let i = 0n; i < b.n; i++) { r *= a.n; rd *= a.d; } return R(r, rd);
  }
  function choose(n, k) {
    if (!isInt(n) || !isInt(k) || k.n < 0n || n.n < 0n) throw new Error("choose");
    if (k.n > n.n) return R(0n);
    return div(fact(n), mul(fact(k), fact(R(n.n - k.n))));
  }

  const SUP = { "⁰": "0", "¹": "1", "²": "2", "³": "3", "⁴": "4", "⁵": "5", "⁶": "6", "⁷": "7", "⁸": "8", "⁹": "9" };
  const UNITS = /\s*(ways?|paths?|teams?|players?|students?|games?|diagonals?|segments?|triangles?|parallelograms?|handfuls?|stacks?|arrangements?|combinations?|groups?|kids?|numbers?|options?|possibilities|jobs?|candies|cookies|marbles?)\.?\s*$/;
  function normalize(s) {
    s = String(s).trim().toLowerCase();
    s = s.replace(/[\u2212\u2013\u2014]/g, "-");
    s = s.replace(/[×✕✖·⋅∙•]/g, "*").replace(/÷/g, "/");
    s = s.replace(/[⁰¹²³⁴⁵⁶⁷⁸⁹]+/g, (m) => "^" + [...m].map((c) => SUP[c]).join(""));
    s = s.replace(UNITS, "");
    s = s.replace(/^[a-z]\s*=\s*/, "");          // "n = 13"
    s = s.replace(/(\d),(?=\d{3}(?!\d))/g, "$1");  // thousands commas
    s = s.replace(/(\d)\s+(?=\d{3}(?!\d))/g, "$1"); // "67 800 320"
    s = s.replace(/(\d+)\s*choose\s*(\d+)/g, "c($1,$2)");
    s = s.replace(/(\d+)\s*c\s*(\d+)/g, "c($1,$2)");
    s = s.replace(/(\d|\))\s*x\s*(?=[\d(c])/g, "$1*");
    return s;
  }
  function tokenize(s) {
    const t = []; let i = 0;
    while (i < s.length) {
      const ch = s[i];
      if (/\s/.test(ch)) { i++; continue; }
      if (/[0-9.]/.test(ch)) { let j = i; while (j < s.length && /[0-9.]/.test(s[j])) j++; t.push({ k: "num", v: s.slice(i, j) }); i = j; continue; }
      if (ch === "c" && s[i + 1] === "(") { t.push({ k: "C" }); i++; continue; }
      if ("+-*/^!(),".includes(ch)) { t.push({ k: ch }); i++; continue; }
      throw new Error("bad char " + ch);
    }
    return t;
  }
  function parseNum(v) {
    if ((v.match(/\./g) || []).length > 1) throw new Error("num");
    if (v.includes(".")) { const [a, b] = v.split("."); return R(BigInt((a || "0") + b), 10n ** BigInt(b.length)); }
    return R(BigInt(v));
  }
  function evaluate(src) {
    const t = tokenize(normalize(src)); let p = 0;
    const peek = () => t[p], eat = (k) => { if (!t[p] || t[p].k !== k) throw new Error("expected " + k); return t[p++]; };
    let ops = 0;
    function expr() { let a = term(); while (peek() && (peek().k === "+" || peek().k === "-")) { const o = t[p++].k; ops++; const b = term(); a = o === "+" ? add(a, b) : sub(a, b); } return a; }
    function startsFactor(tk) { return tk && (tk.k === "num" || tk.k === "(" || tk.k === "C"); }
    function term() {
      let a = power();
      for (;;) {
        const tk = peek();
        if (tk && (tk.k === "*" || tk.k === "/")) { p++; ops++; const b = power(); a = tk.k === "*" ? mul(a, b) : div(a, b); }
        else if (startsFactor(tk)) { ops++; a = mul(a, power()); }
        else break;
      }
      return a;
    }
    function power() { const a = unary(); if (peek() && peek().k === "^") { p++; ops++; return pow(a, power()); } return a; }
    function unary() { if (peek() && peek().k === "-") { p++; return sub(R(0n), unary()); } return post(); }
    function post() { let a = prim(); while (peek() && peek().k === "!") { p++; ops++; a = fact(a); } return a; }
    function prim() {
      const tk = peek(); if (!tk) throw new Error("end");
      if (tk.k === "num") { p++; return parseNum(tk.v); }
      if (tk.k === "(") { p++; const a = expr(); eat(")"); return a; }
      if (tk.k === "C") { p++; eat("("); const n = expr(); eat(","); const k = expr(); eat(")"); ops++; return choose(n, k); }
      throw new Error("unexpected " + tk.k);
    }
    const v = expr(); if (p !== t.length) throw new Error("trailing");
    return { v, ops };
  }
  function tryEval(s) { try { return evaluate(s); } catch (e) { return null; } }
  const show = (r) => (r.d === 1n ? r.n.toLocaleString("en-US") : r.n + "/" + r.d);
  const big = (x) => R(BigInt(x));
  function splitList(s) {
    let n = normalize(s).replace(/\band\b|&|;/g, ",");
    const parts = n.split(/\s*,\s*|\s+/).filter(Boolean);
    return parts;
  }

  /* grade(step, input, others) -> {ok, msg, kind, value} ; others = answers of the problem's other steps (by number) */
  function grade(step, input, others) {
    others = others || [];
    const raw = String(input || "").trim();
    if (!raw) return { ok: false, kind: "empty", msg: "Type an answer first." };
    const type = step.type;
    if (type === "yn") {
      const y = /^(y|yes|true)$/i.test(raw), n = /^(n|no|false)$/i.test(raw);
      if (!y && !n) return { ok: false, kind: "unread", msg: "Answer yes or no." };
      return y === !!step.ans ? { ok: true } : { ok: false, kind: "wrong", msg: "Not quite. Look at the question again." };
    }
    if (type === "choice") {
      const want = String(step.ans).toLowerCase();
      const opts = (step.options || []).map((o) => o.toLowerCase());
      const got = raw.toLowerCase().replace(/[().]/g, "").trim();
      const idx = opts.indexOf(got);
      const asLetter = idx >= 0 ? String.fromCharCode(97 + idx) : got;
      return asLetter === want || got === want ? { ok: true } : { ok: false, kind: "wrong", msg: "Not that one." };
    }
    if (type === "text") {
      const need = step.ans.map((w) => w.toLowerCase());
      const ok = need.every((w) => raw.toLowerCase().includes(w));
      return ok ? { ok: true } : { ok: false, kind: "wrong", msg: "Something important is missing." };
    }
    if (type === "nums") {
      const parts = splitList(raw), vals = [];
      for (const pt of parts) { const e = tryEval(pt); if (!e) return { ok: false, kind: "unread", msg: "I couldn't read that list. Try two numbers like “8 and 3”." }; vals.push(e.v); }
      const want = step.ans.map(big);
      const key = vals.map(show).join(",").replace(/,(?=\d{3})/g, "");
      if (step.named && step.named[vals.map((v) => v.n.toString()).join(",")]) return { ok: false, kind: "named", msg: step.named[vals.map((v) => v.n.toString()).join(",")] };
      if (vals.length !== want.length) return { ok: false, kind: "count", msg: `I expected ${want.length} numbers; you gave ${vals.length}.` };
      const eqv = (a, b) => a.n === b.n && a.d === b.d;
      if (step.order) {
        if (vals.every((v, i) => eqv(v, want[i]))) return { ok: true };
        const sortedSame = [...vals].map(show).sort().join() === [...want].map(show).sort().join();
        if (sortedSame) return { ok: false, kind: "order", msg: "Right numbers, wrong order." };
      } else {
        const a = vals.map(show).sort().join(), b = want.map(show).sort().join();
        if (a === b) return { ok: true };
      }
      const hits = vals.filter((v) => want.some((w) => eqv(v, w))).length;
      if (hits === want.length - 1) return { ok: false, kind: "oneoff", msg: "Right number of values, but one is off." };
      return { ok: false, kind: "wrong", msg: "Those aren't the values." };
    }
    // num / expr
    const e = tryEval(raw);
    if (!e) return { ok: false, kind: "unread", msg: "I couldn't read that. Try a number, or an expression like 12 × 11 ÷ 4." };
    const v = e.v, want = big(step.ans);
    if (type === "expr" && e.ops === 0) return { ok: false, kind: "form", msg: "This step wants an expression (with ×, ÷, ! or a power), not just the number." };
    if (v.n === want.n && v.d === want.d) return { ok: true, value: v };
    if (step.special === "ps17" && isInt(v) && v.n >= 6n && v.n <= 400n) {
      const n = v, s6 = choose(n, R(6n)), s3 = choose(n, R(3n)), six = mul(R(6n), s3);
      const cmp = s6.n < six.n ? "too few sets of 6 — try a bigger n" : "too many sets of 6 — try a smaller n";
      return { ok: false, kind: "named", value: v, msg: `For n = ${show(n)}: sets of 6 = ${show(s6)}, and 6 × sets of 3 = ${show(six)}. That's ${cmp}.` };
    }
    const key = v.d === 1n ? v.n.toString() : null;
    if (key && step.named && step.named[key]) return { ok: false, kind: "named", value: v, msg: step.named[key] };
    for (let i = 0; i < others.length; i++) {
      if (others[i] === null || others[i] === undefined || Array.isArray(others[i])) continue;
      const o = big(others[i]);
      if (o.n === v.n && o.d === v.d) return { ok: false, kind: "otherstep", value: v, msg: `That's step ${i + 1}'s answer.` };
    }
    if (!isInt(v)) return { ok: false, kind: "frac", value: v, msg: "Counts are whole numbers. Is there a division that doesn't come out even?" };
    const diff = v.n > want.n ? v.n - want.n : want.n - v.n;
    const close = diff * 50n <= want.n || diff <= 2n;
    if (close) return { ok: false, kind: "close", value: v, msg: "Very close. Recheck the arithmetic." };
    if (v.n > want.n) {
      const q = v.n / want.n;
      if (v.n % want.n === 0n && q > 1n && q <= 720n) return { ok: false, kind: "big", value: v, msg: "Too big. Did something get counted more than once?" };
      return { ok: false, kind: "big", value: v, msg: "Too big." };
    }
    return { ok: false, kind: "small", value: v, msg: "Too small. Is a choice missing?" };
  }
  return { grade, evaluate: (s) => { const e = tryEval(s); return e ? show(e.v) : null; }, normalize };
})();

</script>
<script>
/* Step-through story: one picture per frame, Back/Next, progress dots, Show all, ←/→ when focused. */
window.STORY = (function () {
  "use strict";
  function setup(st) {
    if (st.dataset.ready) return;
    st.dataset.ready = "1";
    const frames = Array.from(st.querySelectorAll(":scope .frame"));
    const dots = st.querySelector(".dots"), back = st.querySelector("[data-act=back]"), next = st.querySelector("[data-act=next]");
    const all = st.querySelector("input.showall"), name = st.querySelector(".stepname");
    const marks = Array.from(st.querySelectorAll(".plan-side li[data-s], .plan-strip span[data-s]"));
    const skipped = new Set(frames.filter((f) => f.classList.contains("skip")).map((f) => f.dataset.step));
    marks.forEach((m) => m.classList.toggle("skipd", skipped.has(m.dataset.s)));
    let i = 0;
    const seen = new Set([0]);
    frames.forEach((f, k) => {
      const b = document.createElement("button");
      b.type = "button";
      b.setAttribute("aria-label", "Picture " + (k + 1) + " of " + frames.length);
      b.addEventListener("click", () => go(k));
      dots.appendChild(b);
    });
    function go(k) { i = Math.max(0, Math.min(frames.length - 1, k)); seen.add(i); render(); }
    function render() {
      frames.forEach((f, k) => f.classList.toggle("on", k === i));
      Array.from(dots.children).forEach((b, k) => { b.classList.toggle("on", k === i); b.classList.toggle("seen", seen.has(k) && k !== i); });
      back.disabled = i === 0;
      next.disabled = i === frames.length - 1;
      const s = frames[i] && frames[i].dataset.step;
      marks.forEach((m) => m.classList.toggle("on", s && m.dataset.s === s));
      if (name) name.textContent = s && st.dataset.plan ? JSON.parse(st.dataset.plan)[+s - 1] : "";
    }
    back.addEventListener("click", () => go(i - 1));
    next.addEventListener("click", () => go(i + 1));
    st.addEventListener("keydown", (e) => {
      if (e.target.closest("input,textarea,select")) return;
      if (e.key === "ArrowRight") { go(i + 1); e.preventDefault(); }
      else if (e.key === "ArrowLeft") { go(i - 1); e.preventDefault(); }
    });
    all.addEventListener("change", () => st.classList.toggle("all", all.checked));
    st._go = go;
    render();
  }
  function init(root) { (root || document).querySelectorAll(".story").forEach(setup); }
  document.addEventListener("DOMContentLoaded", () => init());
  return { init };
})();

</script>
<script>
/* Pick grid: pointing at (or focusing) a box lights its twin, unless the grid is plain (no twins). */
(function () {
  "use strict";
  function twin(cell) {
    const svg = cell.closest("svg");
    if (!svg || svg.classList.contains("plain")) return null;
    const r = cell.getAttribute("data-r"), c = cell.getAttribute("data-c");
    if (r === c) return null;
    return svg.querySelector('.pg-cell[data-r="' + c + '"][data-c="' + r + '"]');
  }
  function on(e) { const c = e.target.closest && e.target.closest(".pg-cell"); if (!c) return; const t = twin(c); if (t) { t.classList.add("twin-lit"); c.classList.add("twin-lit"); } }
  function off(e) { const c = e.target.closest && e.target.closest(".pg-cell"); if (!c) return; const t = twin(c); if (t) { t.classList.remove("twin-lit"); c.classList.remove("twin-lit"); } }
  document.addEventListener("pointerover", on);
  document.addEventListener("pointerout", off);
  document.addEventListener("focusin", on);
  document.addEventListener("focusout", off);
})();

<script>
/* Workbench: problem rail, tabs, per-step grading loop, hint dialog, submit/reveal, timer, deep links.
   Nothing is stored between visits (no browser storage is used); ink is kept per problem in window.INK. */
(function () {
  "use strict";
  const DATA = JSON.parse(document.getElementById("bench-data").textContent);
  const P = DATA.problems, byId = {};
  P.forEach((p) => (byId[p.id] = p));
  const $ = (id) => document.getElementById(id);
  const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html !== undefined) e.innerHTML = html; return e; };
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

  /* ---- ink per problem ---- */
  const inkStore = {};
  window.INK = { get: (id) => inkStore[id] || [], set: (id, strokes) => { inkStore[id] = strokes; } };

  /* ---- state ---- */
  const S = {};
  P.forEach((p) => {
    S[p.id] = { time: 0, cur: 0, revealed: false, submitted: false, confirmArmed: 0,
      steps: p.steps.map(() => ({ tries: 0, misses: 0, state: "open", work: "", hints: 0, answers: [] })) };
  });
  let cur = null, tab = DATA.page === "lesson" ? "concept" : "problem", lastTick = Date.now();

  function status(id) {
    const s = S[id];
    if (s.revealed || s.steps.every((x) => x.state !== "open")) return "closed";
    if (s.steps.some((x) => x.tries || x.work.trim() || x.hints)) return "prog";
    return "untouched";
  }
  function finished() { return P.filter((p) => status(p.id) === "closed").length; }

  /* ---- console ---- */
  function log(msg, cls) {
    const c = $("console");
    const d = el("div", cls || "");
    const t = new Date();
    d.innerHTML = '<span class="ts">' + String(t.getHours()).padStart(2, "0") + ":" + String(t.getMinutes()).padStart(2, "0") + "</span>" + msg;
    c.appendChild(d);
    c.scrollTop = c.scrollHeight;
    if (cur) (S[cur].log = S[cur].log || []).push(d.outerHTML);
  }

  /* ---- top bar and rail ---- */
  function buildNav() {
    const sel = $("psel"), rail = $("rail");
    let lastSec = null, og = null;
    P.forEach((p) => {
      if (p.section !== lastSec) {
        og = el("optgroup"); og.label = p.section; sel.appendChild(og);
        rail.appendChild(el("h4", "", esc(p.section)));
        lastSec = p.section;
      }
      const o = el("option"); o.value = p.id; o.textContent = p.label; og.appendChild(o);
      const b = el("button", "", '<span class="sdot" aria-hidden="true"></span><span></span>');
      b.type = "button"; b.dataset.id = p.id; b.lastChild.textContent = p.label;
      b.setAttribute("aria-label", p.label);
      b.addEventListener("click", () => { select(p.id); rail.classList.remove("open"); });
      rail.appendChild(b);
    });
    sel.addEventListener("change", () => select(sel.value));
    $("prev").addEventListener("click", () => step(-1));
    $("next").addEventListener("click", () => step(1));
    $("railToggle").addEventListener("click", () => $("rail").classList.toggle("open"));
  }
  function step(d) { const i = P.findIndex((p) => p.id === cur); select(P[(i + d + P.length) % P.length].id); }
  function refreshNav() {
    $("psel").value = cur;
    document.querySelectorAll("#rail button[data-id]").forEach((b) => {
      b.classList.toggle("cur", b.dataset.id === cur);
      const st = status(b.dataset.id);
      b.firstChild.className = "sdot" + (st === "prog" ? " prog" : st === "closed" ? " closed" : "");
      b.setAttribute("aria-label", byId[b.dataset.id].label + " (" + (st === "untouched" ? "not started" : st === "prog" ? "in progress" : "finished") + ")");
    });
    $("finished").textContent = finished() + " / " + P.length + " finished";
  }

  /* ---- timer ---- */
  function tick() {
    const now = Date.now();
    if (cur && !document.hidden) S[cur].time += now - lastTick;
    lastTick = now;
    if (cur) { const s = Math.floor(S[cur].time / 1000); $("timer").textContent = "⏱ " + Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); }
  }
  setInterval(tick, 1000);

  /* ---- tabs ---- */
  function setTab(t) {
    tab = t;
    document.querySelectorAll("#tabs button").forEach((b) => b.setAttribute("aria-selected", String(b.dataset.tab === t)));
    document.querySelectorAll(".tabpanel").forEach((pn) => (pn.hidden = pn.id !== "tab-" + t));
    if (t === "steps") renderMySteps();
  }

  /* ---- middle pane ---- */
  function renderProblem() {
    const p = byId[cur], s = S[cur], box = $("tab-problem");
    let h = '<h2>' + esc(p.label) + "</h2>";
    h += '<div class="ptext">' + esc(p.text) + (p.figure ? '<div class="pfig">' + p.figure + "</div>" : "") + "</div>";
    let meta = "";
    if (p.inclass) meta += '<span class="inclass" title="time in your class video">In class ' + esc(p.inclass) + "</span>";
    if (p.above) meta += '<span class="above">Above grade: split into steps</span>';
    if (meta) h += '<p class="pnote">' + meta + "</p>";
    if (p.note) h += '<p class="pnote">' + esc(p.note) + "</p>";
    const open = s.revealed || s.submitted;
    if (open) {
      h += '<div class="verified" id="verified"><h3>Verified answer: ' + esc(p.answer) + "</h3><p>" + esc(p.check) + "</p>" +
        "<h3>Worked answer</h3>" + p.story + "</div>";
    } else {
      h += '<p class="pnote">The worked answer appears here after you close every step and press <b>Submit question</b>.</p>';
    }
    box.innerHTML = h;
    if (open) window.STORY.init(box);
    if (DATA.page === "lesson") {
      $("tab-concept").innerHTML = DATA.concepts[p.concept];
      window.STORY.init($("tab-concept"));
    }
  }
  function renderMySteps() {
    const p = byId[cur], s = S[cur];
    let h = '<div class="mysteps">';
    p.steps.forEach((st, i) => {
      const x = s.steps[i];
      const res = x.state === "ok" ? "✓ closed" : x.state === "handed" ? "answer handed over" : x.tries ? "open (" + x.tries + " tries)" : "not tried";
      h += '<div class="ms"><b>Step ' + (i + 1) + ":</b> " + esc(st.q) + '<br><span class="pnote">' + res + (x.hints ? ", hint opened" : "") +
        "</span>" + (x.work.trim() ? "<pre>" + esc(x.work) + "</pre>" : "") +
        (x.answers.length ? '<span class="pnote">Answers tried: ' + x.answers.map(esc).join(" · ") + "</span>" : "") + "</div>";
    });
    $("tab-steps").innerHTML = h + "</div>";
  }

  /* ---- right pane ---- */
  function renderRight() {
    const p = byId[cur], s = S[cur], st = p.steps[s.cur], x = s.steps[s.cur];
    const pills = $("pills");
    pills.innerHTML = "";
    p.steps.forEach((_, i) => {
      const b = el("button");
      b.type = "button";
      b.textContent = "Step " + (i + 1);
      const xi = s.steps[i];
      b.className = (i === s.cur ? "cur " : "") + (xi.state === "ok" ? "ok" : xi.state === "handed" ? "handed" : xi.tries ? "tried" : "");
      b.setAttribute("aria-label", "Step " + (i + 1) + (xi.state === "ok" ? ", closed" : xi.state === "handed" ? ", handed over" : ", open"));
      b.addEventListener("click", () => { saveWork(); s.cur = i; renderRight(); });
      pills.appendChild(b);
    });
    $("stepq").textContent = st.q;
    $("work").value = x.work;
    syncGutter();
    $("answer").value = "";
    $("answer").placeholder = st.ph;
    const closed = x.state !== "open";
    $("answer").disabled = closed;
    $("check").disabled = closed;
    $("hint").disabled = closed;
    $("stepstate").textContent = x.state === "ok" ? "Step closed. " + st.ok : x.state === "handed" ? "Answer handed over: " + st.reveal : (x.misses === 3 ? "One final attempt on this step." : "");
    $("reveal").textContent = "Show worked answer";
    $("confirmNote").textContent = "";
    s.confirmArmed = 0;
  }
  function saveWork() { if (cur) S[cur].steps[S[cur].cur].work = $("work").value; }
  function syncGutter() {
    const n = Math.max(6, $("work").value.split("\n").length);
    $("gutter").innerHTML = Array.from({ length: n }, (_, i) => i + 1).join("<br>");
    $("gutter").scrollTop = $("work").scrollTop;
  }

  /* ---- grading loop ---- */
  function nextOpen(s) {
    const n = s.steps.length;
    for (let k = 1; k <= n; k++) { const j = (s.cur + k) % n; if (s.steps[j].state === "open") return j; }
    return s.cur;
  }
  function checkStep() {
    const p = byId[cur], s = S[cur], i = s.cur, st = p.steps[i], x = s.steps[i];
    if (x.state !== "open") return;
    saveWork();
    const val = $("answer").value;
    const others = p.steps.map((o, k) => (k === i ? null : o.ans));
    const r = window.CHECK.grade(st, val, others);
    if (r.kind === "empty" || r.kind === "unread" || r.kind === "count" || r.kind === "form") { log("Step " + (i + 1) + ": " + esc(r.msg), "info"); return; }
    x.tries++;
    x.answers.push(val.trim());
    if (r.ok) {
      x.state = "ok";
      log("✓ Step " + (i + 1) + " closed (“" + esc(val.trim()) + "”). " + esc(st.ok), "ok");
      s.cur = nextOpen(s);
    } else {
      x.misses++;
      const nudge = st.nudges[Math.min(x.misses - 1, 2)];
      if (x.misses <= 3) {
        log("✗ Step " + (i + 1) + ", try " + x.misses + ": “" + esc(val.trim()) + "”. " + esc(r.msg) + " " + esc(nudge), "bad");
        if (x.misses === 3) log("One final attempt on step " + (i + 1) + ".", "hand");
      } else {
        x.state = "handed";
        log("✗ Step " + (i + 1) + ", final attempt: “" + esc(val.trim()) + "”. " + esc(r.msg), "bad");
        log("Handing over step " + (i + 1) + ": " + esc(st.reveal) + " Check: " + esc(st.check) + " Keep going with the next step yourself.", "hand");
        s.cur = nextOpen(s);
      }
    }
    renderRight();
    refreshNav();
    if (tab === "steps") renderMySteps();
  }
  function openHint() {
    const p = byId[cur], s = S[cur], st = p.steps[s.cur];
    s.steps[s.cur].hints++;
    $("hintTitle").textContent = "Hint for step " + (s.cur + 1);
    $("hintBody").textContent = st.hint;
    $("hintDialog").classList.add("open");
    $("hintClose").focus();
    log("Hint opened for step " + (s.cur + 1) + " (doesn't use a try).", "info");
    refreshNav();
  }
  function closeHint() { $("hintDialog").classList.remove("open"); $("answer").focus(); }
  function submit() {
    const p = byId[cur], s = S[cur];
    saveWork();
    const open = s.steps.map((x, i) => (x.state === "open" ? i + 1 : null)).filter(Boolean);
    if (open.length) { log("Not yet: step" + (open.length > 1 ? "s " : " ") + open.join(", ") + " still open.", "info"); return; }
    const lines = s.steps.map((x, i) => "Step " + (i + 1) + ": " + (x.state === "handed" ? "handed over after 4 misses" : x.tries === 1 ? "first try" : "closed on try " + x.tries) + (x.hints ? ", hint used" : ""));
    log("Submitted. " + lines.join("; ") + ". Verified answer and worked story are open in the Problem tab.", "ok");
    s.submitted = true;
    setTab("problem");
    renderProblem();
    refreshNav();
  }
  function reveal() {
    const s = S[cur];
    const untried = s.steps.some((x) => x.state === "open" && x.tries === 0);
    if (untried && !(s.confirmArmed && Date.now() - s.confirmArmed < 8000)) {
      s.confirmArmed = Date.now();
      $("confirmNote").textContent = "Some steps haven't been tried yet. Press again to show the worked answer anyway.";
      $("reveal").textContent = "Yes, show it";
      return;
    }
    s.revealed = true;
    s.confirmArmed = 0;
    $("confirmNote").textContent = "";
    $("reveal").textContent = "Show worked answer";
    log("Worked answer shown.", "info");
    setTab("problem");
    renderProblem();
    refreshNav();
  }

  /* ---- selection ---- */
  function select(id) {
    if (!byId[id]) return;
    tick();
    saveWork();
    const from = cur;
    cur = id;
    document.dispatchEvent(new CustomEvent("bench:problem", { detail: { from, to: id } }));
    $("console").innerHTML = (S[id].log || []).join("");
    renderProblem();
    renderRight();
    setTab(DATA.page === "lesson" ? "concept" : "problem");
    refreshNav();
    window.SAFE.setHash(id);
    tick();
  }

  /* ---- wiring ---- */
  document.addEventListener("DOMContentLoaded", () => {
    buildNav();
    document.querySelectorAll("#tabs button").forEach((b) => b.addEventListener("click", () => setTab(b.dataset.tab)));
    $("check").addEventListener("click", checkStep);
    $("hint").addEventListener("click", openHint);
    $("hintClose").addEventListener("click", closeHint);
    $("submit").addEventListener("click", submit);
    $("reveal").addEventListener("click", reveal);
    $("answer").addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); checkStep(); } });
    $("work").addEventListener("keydown", (e) => { if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) { e.preventDefault(); checkStep(); } });
    $("work").addEventListener("input", () => { syncGutter(); saveWork(); refreshNav(); });
    $("work").addEventListener("scroll", syncGutter);
    document.addEventListener("keydown", (e) => { if (e.key === "Escape" && $("hintDialog").classList.contains("open")) closeHint(); });
    $("hintDialog").addEventListener("click", (e) => { if (e.target === $("hintDialog")) closeHint(); });
    const h = window.SAFE.getHash();
    select(byId[h] ? h : P[0].id);
  });
  window.BENCH = { select, state: S, status, grade: () => checkStep(), current: () => cur };
})();

</script>
<script>
/* Teaching pen.
   Two viewport-sized canvases: `base` holds committed strokes, `live` holds only the stroke being drawn.
   While drawing, only the newest segments are painted; old strokes are never redrawn.
   Reading pages (data-penmode="page"): strokes are stored in page coordinates and stay on the content; a finger scrolls.
   Workbench pages (data-penmode="viewport"): strokes are viewport-anchored, the pen layer swallows scrolling,
   and ink is kept per problem through window.INK.get/set. */
(function () {
  "use strict";
  const MODE = document.body.dataset.penmode === "viewport" ? "viewport" : "page";
  const DPR = Math.min(2, window.devicePixelRatio || 1);
  const COLORS = [["ink", "#1C2A4A"], ["red", "#C23A2E"], ["blue", "#2D6BD0"], ["green", "#1E7A50"]];
  const WIDTHS = [2, 3.5, 6];
  const stats = { framesDrawing: 0, oldRedrawsWhileDrawing: 0, baseRedraws: 0, segmentsPainted: 0 };
  window.__PEN = { stats, mode: MODE, megapixels: () => 2 * (base.width * base.height) / 1e6, strokes: () => strokes };

  const base = document.createElement("canvas"), live = document.createElement("canvas");
  base.className = "pen-canvas base"; live.className = "pen-canvas live";
  base.setAttribute("aria-hidden", "true"); live.setAttribute("aria-hidden", "true");
  const bctx = base.getContext("2d"), lctx = live.getContext("2d");
  let strokes = [], undoStack = [], redoStack = [];
  let on = false, tool = "pen", color = COLORS[0][1], widthIdx = 1, stylusOnly = false;
  let drawing = null, raf = 0, scrollRaf = 0;

  function off() { return MODE === "page" ? [window.scrollX, window.scrollY] : [0, 0]; }
  function size() {
    for (const c of [base, live]) {
      c.width = Math.round(window.innerWidth * DPR);
      c.height = Math.round(window.innerHeight * DPR);
      c.style.width = window.innerWidth + "px";
      c.style.height = window.innerHeight + "px";
      c.getContext("2d").setTransform(DPR, 0, 0, DPR, 0, 0);
    }
    redrawBase();
  }

  /* ---- drawing primitives ---- */
  function style(ctx, s) {
    ctx.lineCap = "round"; ctx.lineJoin = "round";
    ctx.strokeStyle = s.color;
    ctx.globalAlpha = s.tool === "marker" ? 0.32 : 1;
  }
  function seg(ctx, s, k, ox, oy) {
    // smoothed segment k: from mid(k-2,k-1) to mid(k-1,k) with control point k-1
    const p = s.pts;
    const a = p[k - 2] || p[k - 1], b = p[k - 1], c = p[k];
    const m1x = (a[0] + b[0]) / 2 - ox, m1y = (a[1] + b[1]) / 2 - oy, m2x = (b[0] + c[0]) / 2 - ox, m2y = (b[1] + c[1]) / 2 - oy;
    ctx.lineWidth = b[2];
    ctx.beginPath(); ctx.moveTo(m1x, m1y); ctx.quadraticCurveTo(b[0] - ox, b[1] - oy, m2x, m2y); ctx.stroke();
    stats.segmentsPainted++;
  }
  function drawShape(ctx, s, ox, oy) {
    style(ctx, s);
    if (s.tool === "line" || s.snapped) {
      const a = s.pts[0], b = s.pts[s.pts.length - 1];
      ctx.lineWidth = s.w; ctx.beginPath(); ctx.moveTo(a[0] - ox, a[1] - oy); ctx.lineTo(b[0] - ox, b[1] - oy); ctx.stroke();
    } else if (s.tool === "box") {
      const a = s.pts[0], b = s.pts[s.pts.length - 1];
      ctx.lineWidth = s.w; ctx.strokeRect(Math.min(a[0], b[0]) - ox, Math.min(a[1], b[1]) - oy, Math.abs(b[0] - a[0]), Math.abs(b[1] - a[1]));
    } else if (s.tool === "marker") {
      // translucent: draw as one path so overlaps inside the stroke don't darken
      ctx.lineWidth = s.w; ctx.beginPath();
      const p = s.pts; ctx.moveTo(p[0][0] - ox, p[0][1] - oy);

      if (s.pts.length === 1) { ctx.lineWidth = s.pts[0][2]; ctx.beginPath(); ctx.arc(s.pts[0][0] - ox, s.pts[0][1] - oy, s.pts[0][2] / 2, 0, 7); ctx.fillStyle = s.color; ctx.fill(); }

  }
  function redrawBase() {
    if (drawing) stats.oldRedrawsWhileDrawing++;
    stats.baseRedraws++;
    bctx.clearRect(0, 0, base.width, base.height);
    const [ox, oy] = off();
    for (const s of strokes) drawShape(bctx, s, ox, oy);
  }

  /* ---- pointer handling ---- */
  function accept(e) {
    if (!on) return false;
    if (e.pointerType === "touch" && (stylusOnly || MODE === "page")) return false; // palm rejection / finger scrolls

  }
  function pt(e, prev) {
    const [ox, oy] = off();
    const x = e.clientX + ox, y = e.clientY + oy, t = e.timeStamp || performance.now();
    const baseW = WIDTHS[widthIdx] * (tool === "marker" ? 4 : 1);

    if (prev && tool === "pen") {
      const dt = Math.max(1, t - prev[3]), v = Math.hypot(x - prev[0], y - prev[1]) / dt;

  }

    drawing = { tool, color, w: WIDTHS[widthIdx] * (tool === "marker" ? 4 : 1), pts: [p], drawn: 1, snapped: false };

  }
  function move(e) {
    if (!drawing) return;

    schedule();
  }
  function up(e) {
    if (!drawing) return;
    if (drawing.tool === "eraser") {
      if (drawing.removed.length) { undoStack.push({ type: "erase", items: drawing.removed }); redoStack = []; }
      drawing = null; persist(); return;
    }
    cancelAnimationFrame(raf); raf = 0;
    const s = drawing; drawing = null;
    delete s.drawn;
    if ((s.tool === "line" || s.tool === "box" || s.snapped) && s.pts.length > 1) s.pts = [s.pts[0], s.pts[s.pts.length - 1]];
    strokes.push(s);
    undoStack.push({ type: "add", stroke: s }); redoStack = [];

    const [ox, oy] = off();
    drawShape(bctx, s, ox, oy);           // commit: paint only the new stroke onto the base layer
    persist();
  }
  function schedule() { if (!raf) raf = requestAnimationFrame(frame); }
  function frame() {
    raf = 0;
    if (!drawing) return;
    stats.framesDrawing++;
    const s = drawing, [ox, oy] = off();

      style(lctx, s);
      for (let k = Math.max(1, s.drawn); k < s.pts.length; k++) seg(lctx, s, k, ox, oy);   // only new points
      s.drawn = s.pts.length;
    } else {
      // marker, line, box, shift-snapped: the live layer shows just this one shape
      lctx.clearRect(0, 0, live.width, live.height);

  }
  function eraseAt(e) {
    const [ox, oy] = off();
    const x = e.clientX + ox, y = e.clientY + oy;
    let hit = false;
    for (let i = strokes.length - 1; i >= 0; i--) {
      const s = strokes[i];
      const near = s.pts.some((p) => Math.hypot(p[0] - x, p[1] - y) < 12) ||
        ((s.tool === "line" || s.tool === "box" || s.snapped) && nearShape(s, x, y));
      if (near) { drawing.removed.push({ stroke: s, index: i }); strokes.splice(i, 1); hit = true; }
    }
    if (hit) { const d = drawing; drawing = null; redrawBase(); drawing = d; }
  }
  function nearShape(s, x, y) {
    const a = s.pts[0], b = s.pts[s.pts.length - 1];
    const segs = s.tool === "box" ? [[a[0], a[1], b[0], a[1]], [b[0], a[1], b[0], b[1]], [b[0], b[1], a[0], b[1]], [a[0], b[1], a[0], a[1]]] : [[a[0], a[1], b[0], b[1]]];
    return segs.some(([x1, y1, x2, y2]) => {
      const L = Math.hypot(x2 - x1, y2 - y1) || 1, t = Math.max(0, Math.min(1, ((x - x1) * (x2 - x1) + (y - y1) * (y2 - y1)) / (L * L)));
      return Math.hypot(x - (x1 + t * (x2 - x1)), y - (y1 + t * (y2 - y1))) < 10;
    });
  }

  /* ---- history ---- */
  function undo() {
    const a = undoStack.pop(); if (!a) return;
    if (a.type === "add") strokes.splice(strokes.lastIndexOf(a.stroke), 1);
    else if (a.type === "erase") a.items.slice().reverse().forEach((it) => strokes.splice(it.index, 0, it.stroke));
    else if (a.type === "clear") strokes = a.items.slice();
    redoStack.push(a); redrawBase(); persist();
  }
  function redo() {
    const a = redoStack.pop(); if (!a) return;
    if (a.type === "add") strokes.push(a.stroke);
    else if (a.type === "erase") a.items.forEach((it) => { const i = strokes.indexOf(it.stroke); if (i >= 0) strokes.splice(i, 1); });
    else if (a.type === "clear") strokes = [];
    undoStack.push(a); redrawBase(); persist();
  }
  function clearAll() {
    if (!strokes.length) return;
    undoStack.push({ type: "clear", items: strokes.slice() }); redoStack = [];
    strokes = []; redrawBase(); persist();
  }
  function exportPng() {
    try {
      const a = document.createElement("a");
      a.href = base.toDataURL("image/png");
      a.download = "ink.png";
      document.body.appendChild(a); a.click(); a.remove();
      note("Saved the ink only (not the page underneath).");
    } catch (err) { note("Export isn't allowed here."); }
  }

  /* ---- per-problem ink (workbench) ---- */
  let problemId = null;
  function persist() { if (MODE === "viewport" && problemId && window.INK) window.INK.set(problemId, strokes.slice()); }
  document.addEventListener("bench:problem", (e) => {
    if (MODE !== "viewport") return;
    if (e.detail.from && window.INK) window.INK.set(e.detail.from, strokes.slice());
    problemId = e.detail.to;
    strokes = window.INK ? window.INK.get(problemId).slice() : [];
    undoStack = []; redoStack = [];
    redrawBase();
  });

  /* ---- toolbar ---- */
  const bar = document.createElement("div");
  bar.className = "pen-bar"; bar.setAttribute("role", "toolbar"); bar.setAttribute("aria-label", "Teaching pen");
  const btn = (label, title, fn, pressed) => {
    const b = document.createElement("button"); b.type = "button"; b.innerHTML = label; b.title = title; b.setAttribute("aria-label", title);
    if (pressed !== undefined) b.setAttribute("aria-pressed", String(pressed));
    b.addEventListener("click", fn); return b;
  };
  const toggle = btn("✎ Pen", "Pen on/off (P)", () => setOn(!on), false);
  const tools = document.createElement("div"); tools.className = "tools";
  const toolBtns = {};
  [["pen", "✎", "Pen"], ["marker", "▬", "Marker"], ["line", "╱", "Straight line"], ["box", "▭", "Box"], ["eraser", "⌫", "Eraser"]].forEach(([k, g, t]) => {
    toolBtns[k] = btn(g, t, () => setTool(k), k === tool); tools.appendChild(toolBtns[k]);
  });
  tools.appendChild(Object.assign(document.createElement("span"), { className: "sep" }));
  const colBtns = COLORS.map(([n, c], i) => { const b = btn('<span class="sw" style="background:' + c + '"></span>', n + " ink", () => setColor(i), i === 0); tools.appendChild(b); return b; });
  tools.appendChild(Object.assign(document.createElement("span"), { className: "sep" }));
  const wBtns = WIDTHS.map((w, i) => { const b = btn(["thin", "medium", "thick"][i][0].toUpperCase(), ["Thin", "Medium", "Thick"][i] + " nib", () => setWidth(i), i === widthIdx); tools.appendChild(b); return b; });
  tools.appendChild(Object.assign(document.createElement("span"), { className: "sep" }));
  tools.appendChild(btn("↶", "Undo", undo)); tools.appendChild(btn("↷", "Redo", redo)); tools.appendChild(btn("Clear", "Clear all ink (undoable)", clearAll));
  tools.appendChild(btn("PNG", "Export the ink only as a PNG image (not the page)", exportPng));
  const stylusBtn = btn("Stylus only", "Ignore finger touches (palm rejection)", () => { stylusOnly = !stylusOnly; stylusBtn.setAttribute("aria-pressed", String(stylusOnly)); }, false);
  tools.appendChild(stylusBtn);
  const noteEl = document.createElement("span"); noteEl.className = "note"; noteEl.setAttribute("aria-live", "polite");
  tools.appendChild(noteEl);
  bar.appendChild(toggle); bar.appendChild(tools);
  function note(t) { noteEl.textContent = t; }
  function setOn(v) {
    on = v;
    toggle.setAttribute("aria-pressed", String(on));
    bar.classList.toggle("open", on);
    live.classList.toggle("active", on);
    live.classList.toggle(MODE === "page" ? "touchpass" : "swallow", on);

  }
  function setTool(k) { tool = k; Object.entries(toolBtns).forEach(([n, b]) => b.setAttribute("aria-pressed", String(n === k))); }
  function setColor(i) { color = COLORS[i][1]; colBtns.forEach((b, j) => b.setAttribute("aria-pressed", String(i === j))); }
  function setWidth(i) { widthIdx = i; wBtns.forEach((b, j) => b.setAttribute("aria-pressed", String(i === j))); }

  /* ---- wiring ---- */
  function typing(e) { const t = e.target; return !!(t && t.closest && t.closest("input,textarea,select,[contenteditable=true]")); }
  document.addEventListener("keydown", (e) => {
    if (typing(e) || e.ctrlKey || e.metaKey || e.altKey) return;
    if (e.key === "p" || e.key === "P") { setOn(!on); e.preventDefault(); }
    else if (e.key === "Escape" && on) setOn(false);
  });
  live.addEventListener("pointerdown", down);
  live.addEventListener("pointermove", move);
  live.addEventListener("pointerup", up);
  live.addEventListener("pointercancel", up);
  if (MODE === "page") {
    window.addEventListener("scroll", () => { if (!scrollRaf) scrollRaf = requestAnimationFrame(() => { scrollRaf = 0; redrawBase(); }); }, { passive: true });

    live.addEventListener("wheel", (e) => { window.scrollBy(e.deltaX, e.deltaY); }, { passive: true });
  } else {
    live.addEventListener("wheel", (e) => { if (on) e.preventDefault(); }, { passive: false });
  }
  window.addEventListener("resize", size);
  document.addEventListener("DOMContentLoaded", () => {
    document.body.appendChild(base); document.body.appendChild(live); document.body.appendChild(bar);
    size();
  });

})();

</script>
